<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070A08">
<title>FitNote</title>
<style>
/* =====================================================================
   FitNote 设计系统 —— Apple 规范纪律落地
   统一表面 > 碎片化卡片；玻璃只在图层重叠处（吸顶导航 / Tab 栏 / 弹层）
   层级靠字重+字号+灰阶；只有一个强调色
   ===================================================================== */
:root{
  /* v2：中性色带品牌绿偏移（OKLCH H=150），去纯黑纯白 */
  --ground:#070A08;      /* oklch(14.0% 0.008 150) */
  --surface:#111511;      /* oklch(19.0% 0.010 150) */
  --surface-2:#1D221E;
  --surface-3:#2A302B;
  --sep:#2A302B; --hairline:#1D221E;
  --t1:#F3F6F4;               /* 对卡 16.94:1 ✓ */
  --t2:#A9B0AA;               /* 对卡  8.32:1 ✓ */
  --t3:#7B837C;               /* 对卡  4.72:1 ✓ */
  --accent:#56D57B;          /* 对卡  9.83:1 ✓ */
  --accent-ink:#06210F;      /* 绿底深字 9.09:1 ✓（白字仅 1.88:1，不可用） */
  --accent-fill:#56D57B;
  --accent-soft:#142A1A;
  --warn:#FFB020; --danger:#FF5A4E;
  --nav-bg:rgba(7,10,8,.72);
  --r-card:18px; --r-in:12px; --r-pill:999px;
  --sh:0 1px 2px rgba(0,0,0,.5);
}
[data-theme="light"]{
  --ground:#F1F5F1;      /* oklch(96.5% 0.006 150) 灰底带绿 */
  --surface:#FBFEFC;      /* oklch(99.4% 0.004 150) 近白非纯白 */
  --surface-2:#E8ECE9;
  --surface-3:#DADFDB;
  --sep:#DADFDB; --hairline:#E8ECE9;
  --t1:#141A15;               /* 对卡 17.41:1 ✓ */
  --t2:#535A54;               /* 对卡  6.99:1 ✓ */
  --t3:#6F7770;               /* 对卡  4.55:1 ✓（v1 为 3.02:1 不达标） */
  --accent:#00682A;          /* 文字/图标用，对卡 6.86:1 ✓ */
  --accent-fill:#008130;     /* 填充按钮用，白字 5.02:1 ✓ */
  --accent-ink:#FFFFFF;      /* 按钮字（白） */
  --accent-soft:#DDECE3;
  --warn:#A35A00; --danger:#C62A2F;
  --nav-bg:rgba(251,254,252,.80);
  --sh:0 1px 2px rgba(0,0,0,.05);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  width:390px;height:844px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;
  background:var(--ground);color:var(--t1);
  font-family:'HarmonyOS Sans SC','MiSans','PingFang SC','OPPO Sans','SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Microsoft YaHei',sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- 状态栏 ---------- */
.sb{height:50px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 6px;font-size:14px;font-weight:600;position:relative;z-index:5}
.sb .r{display:flex;align-items:center;gap:5px}
.sb svg{width:17px;height:11px;display:block}

/* ---------- 吸顶导航（玻璃层 1/4） ---------- */
.nav{
  flex:none;z-index:20;height:48px;display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;
  background:var(--nav-bg);backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:.5px solid var(--hairline);
}
.nav .ttl{font-size:17px;font-weight:600;letter-spacing:-.2px;opacity:0}
.nav .ops{display:flex;gap:8px;align-items:center;margin-left:auto}
.iconbtn{width:32px;height:32px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:.5px solid var(--hairline);color:var(--t1)}
.iconbtn svg{width:17px;height:17px}

/* ---------- 主体 ---------- */
.scroll{flex:1;overflow:hidden;padding-bottom:44px;position:relative}
.scroll::after{content:'';position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none;
  background:linear-gradient(to top,var(--ground) 6%,rgba(0,0,0,0))}
.pad{padding:0 16px}
.hero{padding:10px 16px 18px}
.hero h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.8px;line-height:1.16}
.hero p{margin:6px 0 0;font-size:14px;color:var(--t2);letter-spacing:.1px}

/* ---------- 表面 ---------- */
.card{background:var(--surface);border:.5px solid var(--hairline);border-radius:var(--r-card);box-shadow:var(--sh);overflow:hidden}
.card+.card{margin-top:12px}
.card>.ttl{padding:14px 16px 10px;font-size:13px;font-weight:600;color:var(--t2);letter-spacing:.3px;text-transform:none}
.sec{margin-top:22px}
.sec>h2{margin:0 0 8px;padding:0 16px;font-size:13px;font-weight:600;color:var(--t2);letter-spacing:.3px}

/* 行 + 发丝分隔线（同组信息统一表面） */
.rows{padding:0 16px}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:.5px solid var(--hairline)}
.rows .row:first-child{border-top:0}
.row .ic{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none}
.row .ic svg{width:16px;height:16px;color:var(--t1)}
.row .ic.acc{background:var(--accent-soft)} .row .ic.acc svg{color:var(--accent)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:500;font-size:15px;letter-spacing:-.1px}
.row .mid span{display:block;font-size:12.5px;color:var(--t2);margin-top:1px}
.row .val{font-size:15px;color:var(--t2);font-weight:500}
.row .chev{width:8px;height:8px;border-right:1.6px solid var(--t3);border-top:1.6px solid var(--t3);transform:rotate(45deg);flex:none;margin-left:2px}

/* ---------- 数据方块 ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:.5px solid var(--hairline);border-radius:var(--r-in);padding:12px 12px 13px}
.tile b{display:block;font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.tile b i{font-size:12px;font-weight:600;font-style:normal;color:var(--t2);margin-left:2px;letter-spacing:0}
.tile span{display:block;font-size:11.5px;color:var(--t2);margin-top:4px;letter-spacing:.1px}
.tile.on b{color:var(--accent)}

/* ---------- 按钮 ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;height:48px;border-radius:14px;
  font-size:16px;font-weight:600;letter-spacing:-.1px;border:0;width:100%;
  background:var(--accent-fill);color:var(--accent-ink);font-family:inherit}
.btn.ghost{background:var(--surface-2);color:var(--t1);border:.5px solid var(--hairline)}
.btn.sm{height:38px;border-radius:11px;font-size:14px;width:auto;padding:0 16px}
.btn svg{width:18px;height:18px}

/* ---------- 分段控件 ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;border:0;background:transparent;color:var(--t2);font-family:inherit;font-size:13.5px;font-weight:500;border-radius:8px}
.seg button.on{background:var(--surface);color:var(--t1);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.seg.acc button.on{background:var(--accent-fill);color:var(--accent-ink);box-shadow:none}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow:hidden;padding:0 16px}
.chip{height:32px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface-2);border:.5px solid var(--hairline);
  color:var(--t2);font-size:13.5px;font-weight:500;display:flex;align-items:center;flex:none}
.chip.on{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}

/* ---------- 进度条 ---------- */
.bar{height:6px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--accent)}
.bar.thin{height:4px}

/* ---------- 步进器（记组核心控件） ---------- */
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:14px;padding:6px;border:.5px solid var(--hairline)}
.stepper button{width:44px;height:44px;border-radius:11px;border:0;background:var(--surface-3);color:var(--t1);font-size:22px;font-weight:400;display:flex;align-items:center;justify-content:center;font-family:inherit}
.stepper .v{font-size:26px;font-weight:700;letter-spacing:-.6px;display:flex;align-items:baseline;gap:4px}
.stepper .v u{font-size:13px;font-weight:600;color:var(--t2);text-decoration:none}

/* ---------- 底部 Tab 栏（玻璃层 2/4） ---------- */
.tabbar{
  position:absolute;left:12px;right:12px;bottom:20px;height:62px;z-index:30;
  display:flex;align-items:center;padding:0 6px;border-radius:26px;
  background:var(--nav-bg);backdrop-filter:blur(28px) saturate(190%);
  -webkit-backdrop-filter:blur(28px) saturate(190%);
  border:.5px solid var(--sep);
  box-shadow:0 12px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.18);
}
.tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--t3);position:relative}
.tabbar .tb svg{width:23px;height:23px}
.tabbar .tb span{font-size:10px;letter-spacing:.1px}
.tabbar .tb.on{color:var(--accent)}
.tabbar .tb.on span{font-weight:600}
/* 液态滑动高光块 */
.glider{position:absolute;top:6px;height:50px;border-radius:18px;background:var(--accent-soft);border:.5px solid rgba(62,209,127,.22)}
.fab{width:46px;height:46px;border-radius:15px;background:var(--accent);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(62,209,127,.34), inset 0 1px 0 rgba(255,255,255,.34)}
.fab svg{width:24px;height:24px;color:var(--accent-ink)}

/* 引导步骤点 */
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface-3)}
.dots i.on{width:20px;border-radius:99px;background:var(--accent)}

/* 固定底栏（引导页主按钮等）——独立于滚动内容，不被 .scroll 的渐隐遮罩冲淡 */
.dock{flex:none;position:relative;z-index:35;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--ground)}

/* =====================================================================
   玻璃增强（与 App 同款，纯 CSS 视觉等效）
   注：Chromium 的 backdrop-filter 不支持 url(#svgFilter)，故不用位移滤镜
   ===================================================================== */
.tabbar{
  background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.055) 58%,rgba(255,255,255,.085));
  backdrop-filter:blur(30px) saturate(215%) brightness(1.07);
  -webkit-backdrop-filter:blur(30px) saturate(215%) brightness(1.07);
  box-shadow:
    0 22px 52px rgba(0,0,0,.5),
    0 3px 10px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.58),
    inset 0 -1.5px 0 rgba(0,0,0,.32),
    inset 0 0 0 1px rgba(255,255,255,.14);
}
.tabbar::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;z-index:2;
  background:linear-gradient(150deg,
    rgba(190,255,220,.5),rgba(160,215,255,.32) 34%,
    rgba(255,190,235,.24) 58%,rgba(180,255,225,.38) 82%,rgba(255,255,255,.4));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  mix-blend-mode:screen;opacity:.28;
}
.tabbar::after{
  content:'';position:absolute;left:4%;right:4%;top:1px;height:30%;border-radius:inherit;pointer-events:none;z-index:2;
  background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,.05) 58%,transparent);
  mix-blend-mode:screen;opacity:.7;
}
.nav{
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));
  backdrop-filter:blur(26px) saturate(200%) brightness(1.06);
  -webkit-backdrop-filter:blur(26px) saturate(200%) brightness(1.06);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.14), 0 6px 20px rgba(0,0,0,.24);
}

/* =====================================================================
   人体肌群图
   ===================================================================== */
.bodysvg{width:100%;height:auto;display:block}
.bodysvg .mu{stroke:var(--ground);stroke-width:.8;transition:fill .28s ease}
/* 静默态：身体轮廓 */
.bodysvg .k-rest{fill:var(--surface-3)}
/* 选动作时：主肌群 / 协同肌群 */
.bodysvg .k-p{fill:var(--accent)}
.bodysvg .k-s{fill:var(--accent-soft);opacity:.85}
[data-theme="light"] .bodysvg .k-s{fill:rgba(0,129,48,.30)}
/* 热力图：按训练量递增（越高越深） */
.bodysvg .k-load-none{fill:var(--surface-3)}
.bodysvg .k-load-light{fill:rgba(86,213,123,.26)}
.bodysvg .k-load-mid{fill:rgba(86,213,123,.55)}
.bodysvg .k-load-full{fill:var(--accent)}
.bodysvg .k-load-over{fill:var(--warn)}       /* 超过推荐区间 → 警示色 */
[data-theme="light"] .bodysvg .k-load-light{fill:rgba(0,129,48,.18)}
[data-theme="light"] .bodysvg .k-load-mid{fill:rgba(0,129,48,.44)}
[data-theme="light"] .bodysvg .k-load-full{fill:#008130}
[data-theme="light"] .bodysvg .k-load-over{fill:#A35A00}
/* 图例色块 */
.lg-sq{width:11px;height:11px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:5px}

/* ================= FitNote 附加组件（补齐设计稿用到的组件） ================= */
.sep{height:1px;background:var(--hairline)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;
  background:var(--surface-2);border:.5px solid var(--hairline);color:var(--t2);
  font-size:11.5px;font-weight:500}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.gray{background:var(--surface-2);color:var(--t2);border:.5px solid var(--hairline)}
:root{--warn-soft:#2B2311}
[data-theme="light"]{--warn-soft:#F6ECD8}

/* toast */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);z-index:120;
  background:var(--t1);color:var(--ground);font-size:13.5px;font-weight:500;padding:10px 16px;
  border-radius:99px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:82vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 全屏覆盖层（二级页面） */
.screen{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  background:var(--ground);color:var(--t1)}
.screen .scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:120px}
.screen .scroll::-webkit-scrollbar{display:none}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

/* 底部弹层（快速入口 / 选择器） */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:90;opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.mask.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;transform:translateY(104%);transition:transform .32s cubic-bezier(.32,.72,.25,1);
  background:var(--surface);border-radius:22px 22px 0 0;border:.5px solid var(--sep);border-bottom:0;
  max-height:86vh;overflow-y:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:36px;height:4.5px;border-radius:99px;background:var(--surface-3);margin:10px auto 2px}
.sheet::-webkit-scrollbar{display:none}

/* 表单控件 */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;color:var(--t2);margin:0 2px 7px;letter-spacing:.2px}
.inp{width:100%;height:46px;padding:0 13px;border-radius:12px;border:.5px solid var(--sep);
  background:var(--surface-2);color:var(--t1);font-size:16px;font-family:inherit;font-variant-numeric:tabular-nums}
.inp:focus{outline:none;border-color:var(--accent)}
.inp-row{display:flex;align-items:center;gap:8px}
.inp-row .inp{flex:1}
.inp-row .unit{font-size:13px;color:var(--t3);width:22px;flex:none}
select.inp{appearance:none;-webkit-appearance:none}

/* 引导页 */
.wheelrow{display:flex;align-items:flex-start;gap:0}
.wheel{flex:1;text-align:center}
.wheel .lbl{font-size:12px;color:var(--t3);margin-bottom:6px}
.wheel .val{font-size:28px;font-weight:700;letter-spacing:-.6px}
.wheel .val i{font-size:13px;font-weight:600;font-style:normal;color:var(--t2);margin-left:3px}
.wheel .rule{height:1px;background:var(--accent);margin:8px 22px 0;opacity:.5}

/* 计划选择 */
.plan{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border-radius:14px;
  background:var(--surface);border:.5px solid var(--hairline);margin-top:10px}
.plan.on{border-color:var(--accent);background:var(--accent-soft)}
.plan .rd{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--t3);flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center}
.plan.on .rd{border-color:var(--accent);background:var(--accent)}
.plan.on .rd svg{width:12px;height:12px;color:var(--accent-ink)}
.plan b{display:block;font-size:16px;font-weight:600;letter-spacing:-.2px}
.plan em{display:block;font-style:normal;font-size:13px;color:var(--t2);margin-top:3px;line-height:1.45}
.plan i{display:inline-block;font-style:normal;font-size:11.5px;color:var(--t2);margin-top:7px;
  padding:2px 8px;border-radius:99px;background:var(--surface-2)}
.plan.on i{background:rgba(62,209,127,.16);color:var(--accent)}
.dot{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--t3);flex:none}
.dot.done{background:var(--accent);color:var(--accent-ink);font-weight:700}
.dot.today{border:2px solid var(--accent);color:var(--accent);font-weight:700}

/* 训练进行中 */
.stepline{display:flex;align-items:center;gap:10px}
.stepline>.lb{width:40px;font-size:13px;color:var(--t2);flex:none}

/* 人体图 */
.bodywrap{display:flex;gap:0;align-items:flex-start;justify-content:center}
.bodywrap figure{margin:0;flex:1;max-width:132px}
.bodywrap figcaption{text-align:center;font-size:11px;color:var(--t3);margin-top:6px;letter-spacing:.02em}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:14px;font-size:10.5px;color:var(--t3);text-align:center}
.mrw{display:flex;align-items:center;gap:10px;padding:10px 0}
.mrw .nm{flex:1;font-size:14px}
.mrw .bar{position:relative;width:64px;height:5px}
.mrw .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.mrw .bar i.over{background:var(--warn)}

/* 日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{font-size:11px;color:var(--t3);text-align:center;padding-bottom:4px}
.cd{aspect-ratio:1;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:12.5px;color:var(--t2);position:relative}
.cd.blank{background:transparent}
.cd.done{background:var(--accent-soft);color:var(--t1)}
.cd.done::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cd.today{outline:2px solid var(--accent);outline-offset:-2px;color:var(--t1);font-weight:700}
.cd.rest{color:var(--t3)}
.lg{display:flex;gap:14px;font-size:11.5px;color:var(--t3)}
.lg i{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:4px}

/* PR */
.prrow{display:flex;align-items:center;gap:10px;padding:12px 0}
.prrow .rk{width:22px;height:22px;border-radius:50%;background:var(--surface-3);color:var(--t2);
  font-size:11.5px;display:flex;align-items:center;justify-content:center;flex:none}

(function () {
  var _fetch = (typeof window.fetch === 'function') ? window.fetch.bind(window) : null
  function mimeFor(u){
    if (/\.wasm(\?|$)/i.test(u)) return 'application/wasm'
    if (/\.onnx(\?|$)/i.test(u)) return 'application/octet-stream'
    return 'application/octet-stream'
  }
  function viaXhr(url){
    return new Promise(function (res, rej){
      var x = new XMLHttpRequest()
      x.open('GET', url, true)
      x.responseType = 'arraybuffer'
      x.onload = function (){
        if (x.status === 0 || (x.status >= 200 && x.status < 300)){
          try { res(new Response(x.response, { status:200, headers:{ 'Content-Type': mimeFor(url) } })) }
          catch (e) { rej(e) }
        } else rej(new TypeError('HTTP ' + x.status + ' for ' + url))
      }
      x.onerror = function (){ rej(new TypeError('Failed to fetch ' + url)) }
      try { x.send() } catch (e) { rej(e) }
    })
  }
  window.fetch = function (input, init){
    var url = (typeof input === 'string') ? input : (input && input.url) || ''
    if (url.indexOf('file://') === 0) return viaXhr(url)
    /* 页面本身是 file:// 时，相对路径请求（ort 的 wasmPaths='./' 与模型文件名）也一并走 XHR，
       否则会漏到原生 fetch 被 "URL scheme file is not supported" 拒绝 */
    if (url && location.protocol === 'file:' && !/^(https?:|data:|blob:|about:)/i.test(url)){
      try {
        var abs = new URL(url, location.href).href
        if (abs.indexOf('file://') === 0) return viaXhr(abs)
      } catch (e) {}
    }
    if (_fetch) return _fetch(input, init)
    return Promise.reject(new TypeError('fetch unavailable'))
  }
})()

</script>

/* ------------------------------ 外观主题 ------------------------------
   按 Apple 设计规范：层级靠灰阶，颜色只作强调；浅/深色跟随系统或手动指定 */
function applyTheme(m){
  try {
    if (m) localStorage.setItem('bf_theme', m)
    else m = localStorage.getItem('bf_theme') || 'dark'
    var el = document.documentElement
    if (m === 'auto') el.removeAttribute('data-theme'); else el.setAttribute('data-theme', m)
    return m
  } catch (e) { return 'auto' }
}
function currentTheme(){ try { return localStorage.getItem('bf_theme') || 'dark' } catch (e) { return 'auto' } }
applyTheme()

/* ------------------------------ 工具 ------------------------------ */
function $(s){ return document.querySelector(s) }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c] }) }
function fmt(n, d){ if (!isFinite(n)) return '--'; d = (d == null) ? 1 : d; var p = Math.pow(10, d); return String(Math.round(n * p) / p) }
function pad(n){ return n < 10 ? '0' + n : '' + n }
function fmtTime(ts){
  if (!ts) return ''
  var d = new Date(ts)
  var now = new Date()
  var today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime()
  var hh = pad(d.getHours()) + ':' + pad(d.getMinutes())
  if (ts >= today0) return '今天 ' + hh
  if (ts >= today0 - 86400000) return '昨天 ' + hh
  return mdLabel(isoDate(d)) + ' ' + hh
}
function isoDate(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) }
function todayISO(){ return isoDate(new Date()) }
function dateShift(iso, delta){ var p = iso.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); d.setDate(d.getDate() + delta); return isoDate(d) }
function mdLabel(iso){ var p = iso.split('-'); return (+p[1]) + '/' + (+p[2]) }
function weekdayIndex(d){ return (d.getDay() + 6) % 7 }
function nowMinutes(){ var d = new Date(); return d.getHours() * 60 + d.getMinutes() }
function hmToMin(hm){ var p = (hm || '00:00').split(':'); return (+p[0]) * 60 + (+p[1]) }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7) }

var MEAL_ICON = { breakfast:'coffee', lunch:'sun', dinner:'moon', snack:'utensils' }
var toastTimer = null
function toast(msg){ var el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.classList.remove('on') }, 2000) }

/* ------------------------------ 存储 ------------------------------ */
var Store = (function () {
  var RK = 'bf_records_v1', PK = 'bf_plan_v1', CK = 'bf_checkin_v1', LK = 'bf_cal_v1', UF = 'bf_user_foods_v1', CFG = 'bf_cfg_v1', AIK = 'bf_ai_cfg_v1'
  function read(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch (e) { return d } }
  function write(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); autoBackup(); return true } catch (e) { toast('存储失败，空间可能不足'); return false } }
  function remove(k){ try { localStorage.removeItem(k); autoBackup() } catch (e) {} }

  function records(){ return read(RK, []) }
  function addRecord(r){ var a = records(); a.push(r); write(RK, a); return r }
  function delRecord(id){ write(RK, records().filter(function (x){ return x.id !== id })) }
  function clearRecords(){ remove(RK); remove(PK) }

  function plan(){ return read(PK, null) }
  function savePlan(p){ write(PK, p); return p }
  function clearPlan(){ remove(PK) }

  function checkin(date){ var all = read(CK, {}); return all[date] || {} }
  function setCheckin(date, part){ var all = read(CK, {}); var c = all[date] || {}; for (var k in part) c[k] = part[k]; all[date] = c; write(CK, all) }

  function logs(date){ var all = read(LK, {}); return all[date] || [] }
  function addLog(date, item){ var all = read(LK, {}); var a = all[date] || []; a.push(item); all[date] = a; write(LK, all) }
  function delLog(date, id){ var all = read(LK, {}); all[date] = (all[date] || []).filter(function (x){ return x.id !== id }); write(LK, all) }

  function userFoods(){ return read(UF, []) }
  function saveUserFoods(a){ write(UF, a) }

  function cfg(){ return read(CFG, null) }
  function saveCfg(c){ write(CFG, c) }

  function aiCfg(){ return read(AIK, null) }
  function saveAiCfg(c){ write(AIK, c) }

  function exportAll(){
    return { app:'bodyfat', v:1, exportedAt:new Date().toISOString(),
      records:records(), plan:plan(), checkin:read(CK, {}), logs:read(LK, {}), userFoods:userFoods(),
      sessions:sessions(), active:activeSession(), userEx:userEx() }
  }
  function importAll(data){
    if (!data || data.app !== 'bodyfat') return false
    if (Array.isArray(data.records)) write(RK, data.records)
    if (data.plan) write(PK, data.plan)
    if (data.checkin) write(CK, data.checkin)
    if (data.logs) write(LK, data.logs)
    if (Array.isArray(data.userFoods)) write(UF, data.userFoods)
    if (Array.isArray(data.sessions)) write(TK, data.sessions)
    if (Array.isArray(data.userEx)) write(EK, data.userEx)
    if (data.active) setActiveSession(data.active)
    return true
  }
  function clearAll(){ [RK, PK, CK, LK, TK, EK, AK].forEach(remove) }

  /* ---- 训练记录（v1.0）---- */
  var TK = 'bf_train_v1', EK = 'bf_ex_v1', AK = 'bf_active_v1'
  function sessions(){ return read(TK, []) }
  function sessionById(id){ var a = sessions(); for (var i = 0; i < a.length; i++){ if (a[i].id === id) return a[i] } return null }
  function saveSession(s){
    var a = sessions(), i = -1
    for (var j = 0; j < a.length; j++){ if (a[j].id === s.id){ i = j; break } }
    if (i >= 0) a[i] = s; else a.push(s)
    write(TK, a); return s
  }
  function delSession(id){ write(TK, sessions().filter(function (x){ return x.id !== id })) }
  function sessionsByDate(date){ return sessions().filter(function (x){ return x.date === date }) }
  function sessionsInRange(from, to){ return sessions().filter(function (x){ return x.date >= from && x.date <= to }) }
  /* 正在进行的训练：用于「继续上次」。单独存一个键，App 被杀掉也不丢 */
  function activeSession(){ return read(AK, null) }
  function setActiveSession(sv){ if (sv) write(AK, sv); else remove(AK) }
  /* 自定义动作 */
  function userEx(){ return read(EK, []) }
  function saveUserEx(a){ write(EK, a) }

  /* 本地自动备份：每次写入后把全量快照落到独立键（绕过 write 防止递归） */
  var BK = 'bf_backup_auto_v1'
  function autoBackup(){
    try { var snap = exportAll(); snap._ts = Date.now(); localStorage.setItem(BK, JSON.stringify(snap)) } catch (e) {}
  }
  function latestBackup(){ try { var v = localStorage.getItem(BK); return v ? JSON.parse(v) : null } catch (e) { return null } }

  return { records:records, addRecord:addRecord, delRecord:delRecord, clearRecords:clearRecords,
    plan:plan, savePlan:savePlan, clearPlan:clearPlan,
    checkin:checkin, setCheckin:setCheckin,
    logs:logs, addLog:addLog, delLog:delLog,
    sessions:sessions, sessionById:sessionById, saveSession:saveSession, delSession:delSession,
    sessionsByDate:sessionsByDate, sessionsInRange:sessionsInRange,
    activeSession:activeSession, setActiveSession:setActiveSession,
    userEx:userEx, saveUserEx:saveUserEx,
    userFoods:userFoods, saveUserFoods:saveUserFoods,
    cfg:cfg, saveCfg:saveCfg, aiCfg:aiCfg, saveAiCfg:saveAiCfg,
    exportAll:exportAll, importAll:importAll, clearAll:clearAll,
    autoBackup:autoBackup, latestBackup:latestBackup }
})()

/* ------------------------------ 配置（三餐时间窗） ------------------------------ */
var AppCfg = {
  defaultMeals: {
    breakfast: { label:'早餐', emoji:'🌅', start:'05:00', end:'09:30' },
    lunch:     { label:'午餐', emoji:'☀️', start:'11:00', end:'13:30' },
    dinner:    { label:'晚餐', emoji:'🌙', start:'17:00', end:'20:30' }
  },
  _m: null,
  meals: function () {
    if (this._m) return this._m
    var c = Store.cfg()
    this._m = (c && c.meals) ? c.meals : JSON.parse(JSON.stringify(this.defaultMeals))
    return this._m
  },
  /* 统一取三餐/加餐的元信息（snack 不在三餐时间窗里，单独兜底） */
  mealMeta: function (key) {
    if (key === 'snack') return { label:'加餐', emoji:'🍎', start:'00:00', end:'23:59' }
    return this.meals()[key] || { label:'加餐', emoji:'🍎', start:'00:00', end:'23:59' }
  },
  saveMeals: function (m) { var c = Store.cfg() || {}; c.meals = m; Store.saveCfg(c); this._m = null },
  mealKeys: function () { return ['breakfast', 'lunch', 'dinner'] },
  /* 当前时间对应哪一餐（用于记餐自动归类） */
  currentMeal: function () {
    var mins = nowMinutes(), m = this.meals()
    if (mins <= hmToMin(m.breakfast.end)) return 'breakfast'
    if (mins <= hmToMin(m.lunch.end)) return 'lunch'
    if (mins <= hmToMin(m.dinner.end)) return 'dinner'
    return 'snack'
  },
  /* 某一餐在指定日期的状态：eaten / missed / open / upcoming */
  mealStatus: function (dateISO, key) {
    var m = this.mealMeta(key)
    var kcal = Store.logs(dateISO).filter(function (x){ return x.meal === key }).reduce(function (s, x){ return s + x.kcal }, 0)
    if (kcal > 0) return { state:'eaten', kcal:kcal, label:m.label, emoji:m.emoji }
    var today = todayISO()
    if (dateISO < today) return { state:'missed', kcal:0, label:m.label, emoji:m.emoji }
    if (dateISO > today) return { state:'upcoming', kcal:0, label:m.label, emoji:m.emoji }
    var mins = nowMinutes()
    if (mins < hmToMin(m.start)) return { state:'upcoming', kcal:0, label:m.label, emoji:m.emoji }
    if (mins < hmToMin(m.end)) return { state:'open', kcal:0, label:m.label, emoji:m.emoji }
    return { state:'missed', kcal:0, label:m.label, emoji:m.emoji }
  },
  STATUS_TEXT: { eaten:'已吃', missed:'没吃', open:'进行中', upcoming:'未到' },
  SHARE: { breakfast:0.25, lunch:0.35, dinner:0.30, snack:0.10 }
}

/* ------------------------------ 体脂算法引擎 ------------------------------ */
var Engine = (function () {
  function bmi(w, h){ if (!w || !h) return NaN; return w / Math.pow(h / 100, 2) }
  function navy(gender, waist, neck, hip, height){
    if (gender === 'm'){
      var wm = waist - neck; if (!(wm > 0)) return NaN
      return 495 / (1.0324 - 0.19077 * Math.log10(wm) + 0.15456 * Math.log10(height)) - 450
    }
    var wf = waist + hip - neck; if (!(wf > 0)) return NaN
    return 495 / (1.29579 - 0.35004 * Math.log10(wf) + 0.22100 * Math.log10(height)) - 450
  }
  function deurenberg(gender, age, b){ return 1.20 * b + 0.23 * age - 10.8 * (gender === 'm' ? 1 : 0) - 5.4 }
  function level(gender, bf){
    if (!isFinite(bf)) return { key:'unknown', label:'--', tone:'ok', range:'' }
    var t = (gender === 'm')
      ? [ [6,'low'],[14,'athlete'],[18,'fit'],[25,'average'],[35,'obese'],[999,'obese2'] ]
      : [ [14,'low'],[21,'athlete'],[25,'fit'],[32,'average'],[42,'obese'],[999,'obese2'] ]
    for (var i = 0; i < t.length; i++){ if (bf < t[i][0]) return map(t[i][1], gender) }
    return map('obese2', gender)
  }
  function map(key, gender){
    var m = {
      low:     { label:'体脂偏低', tone:'warn',  range: gender === 'm' ? '男 <6%'   : '女 <14%' },
      athlete: { label:'运动员型', tone:'great', range: gender === 'm' ? '男 6–13%'  : '女 14–20%' },
      fit:     { label:'健美型',   tone:'great', range: gender === 'm' ? '男 14–17%' : '女 21–24%' },
      average: { label:'正常范围', tone:'ok',    range: gender === 'm' ? '男 18–24%' : '女 25–31%' },
      obese:   { label:'偏高',     tone:'warn',  range: gender === 'm' ? '男 25–34%' : '女 32–41%' },
      obese2:  { label:'肥胖',     tone:'bad',   range: gender === 'm' ? '男 ≥35%'   : '女 ≥42%' }
    }
    var o = m[key]; return { key:key, label:o.label, tone:o.tone, range:o.range }
  }
  function toneColor(t){ return { great:'var(--great)', ok:'var(--ok)', warn:'var(--warn)', bad:'var(--bad)' }[t] || 'var(--ok)' }
  function idealWeight(h){ var x = h / 100; return { min:Math.round(18.5 * x * x * 10) / 10, max:Math.round(23.9 * x * x * 10) / 10 } }
  function fatMass(w, bf){ return w * bf / 100 }
  function leanMass(w, bf){ return w - w * bf / 100 }

  function byName(name){
    for (var i = 0; i < FOODS.length; i++){ if (FOODS[i].name === name) return FOODS[i] }

  /* 搜索：名称命中优先于分类命中，且匹配位置越靠前排越前。
     否则搜「奶」会被「分类=豆奶」的豆腐类抢走前几条（库扩到 1,800 条后噪音会很明显）。 */
  function search(q, cat){
    var k = (q || '').trim().toLowerCase()
    if (!k) return FOODS.filter(function (f){ return !cat || f.cat === cat })
    var byName = [], byCat = []
    for (var i = 0; i < FOODS.length; i++){
      var f = FOODS[i]
      if (cat && f.cat !== cat) continue
      if (f.name.toLowerCase().indexOf(k) >= 0) byName.push(f)
      else if (f.cat.indexOf(k) >= 0) byCat.push(f)
    }
    byName.sort(function (a, b){
      return a.name.toLowerCase().indexOf(k) - b.name.toLowerCase().indexOf(k)
    })
    return byName.concat(byCat)
  }

  }

    if (!(remain > 0)) return []

  }
  function mealRecommend(mealKey, remain){
    var pool = MEAL_POOL[mealKey] || MEAL_POOL.snack
    var items = pool.map(byName).filter(Boolean)
    if (remain > 0) return items.filter(function (f){ return calc(f, f.def) <= remain }).sort(function (a, b){ return calc(b, b.def) - calc(a, a.def) }).slice(0, 6)

  }

  function removeUser(id){

  var extra = { done:false, add:0, failed:false }
  function loadExtra(){
    if (extra.done) return Promise.resolve(extra.add)
    extra.done = true
    return new Promise(function (resolve){
      var x = new XMLHttpRequest()
      try { x.open('GET', 'foods.json', true) } catch (e) { extra.failed = true; resolve(0); return }
      x.onload = function (){
        var add = 0
        try {
          var arr = JSON.parse(x.responseText)
          if (arr && arr.length){
            var seen = {}
            FOODS.forEach(function (f){ seen[f.name] = 1 })
            for (var i = 0; i < arr.length; i++){
              var r = arr[i]
              if (!r || !r[0] || seen[r[0]]) continue

              add++
            }
          }
        } catch (e) { extra.failed = true }
        extra.add = add
        resolve(add)
      }
      x.onerror = function (){ extra.failed = true; resolve(0) }
      x.send()
    })
  }
  function extraInfo(){ return extra }

  var EX = RAW.map(function (r){ return { id:r[0], name:r[1], muscle:r[2], equip:r[3], also:r[4], rec:r[5], alt:r[6] } })
  var MAP = {}
  EX.forEach(function (e){ MAP[e.id] = e })

  var MUSCLES = ['胸', '背', '腿', '肩', '手臂', '核心', '有氧']

  /* 内置 + 自定义 */
  function all(){
    var u = Store.userEx() || []
    return u.length ? EX.concat(u) : EX
  }
  function byId(id){
    if (MAP[id]) return MAP[id]
    var u = Store.userEx() || []
    for (var i = 0; i < u.length; i++){ if (u[i].id === id) return u[i] }
    return null
  }
  function byName(n){
    var a = all()
    for (var i = 0; i < a.length; i++){ if (a[i].name === n) return a[i] }
    return null
  }
  function muscles(){ return MUSCLES.slice() }
  /* 搜索：名称命中优先于肌群命中 */
  function search(q, muscle){
    var k = (q || '').trim().toLowerCase()
    var src = all().filter(function (e){ return !muscle || e.muscle === muscle })
    if (!k) return src
    var byN = [], byM = []
    for (var i = 0; i < src.length; i++){
      var e = src[i]
      if (e.name.toLowerCase().indexOf(k) >= 0) byN.push(e)
      else if ((e.muscle + e.equip).indexOf(k) >= 0) byM.push(e)
    }
    byN.sort(function (a, b){ return a.name.toLowerCase().indexOf(k) - b.name.toLowerCase().indexOf(k) })
    return byN.concat(byM)
  }
  /* 同类替代：器械被占用时的一键换动作 */
  function altsOf(id){
    var e = byId(id); if (!e) return []
    return (e.alt || []).map(byId).filter(Boolean)
  }
  function addUserEx(name, muscle, equip, alt){
    var u = Store.userEx() || []
    var e = { id:'u' + Date.now().toString(36), name:name, muscle:muscle || '其他', equip:equip || '其他',
              also:'', rec:'3×10', alt:alt || [], user:true }
    u.push(e); Store.saveUserEx(u); return e
  }
  function delUserEx(id){
    var u = (Store.userEx() || []).filter(function (x){ return x.id !== id })
    Store.saveUserEx(u); return true
  }

  /* ---------- 容量口径（规范 §3.3）：仅正式组；自重不计入，单独统计 ---------- */
  function volumeOf(sv){
    return Math.round((sv.sets || []).reduce(function (s, x){
      return s + (x.isWarmup ? 0 : ((x.weightKg || 0) * (x.reps || 0)))
    }, 0))
  }
  function setCount(sv){ return (sv.sets || []).filter(function (x){ return !x.isWarmup }).length }
  function warmupCount(sv){ return (sv.sets || []).filter(function (x){ return x.isWarmup }).length }
  function bodyweightSets(sv){ return (sv.sets || []).filter(function (x){ return !x.isWarmup && !(x.weightKg > 0) }).length }
  function durationMin(sv){
    if (!sv.startTs) return 0
    return Math.max(0, Math.round(((sv.endTs || Date.now()) - sv.startTs) / 60000))
  }
  /* Epley 估算 1RM */
  function est1RM(w, reps){
    if (!(w > 0) || !(reps > 0)) return 0
    return Math.round(w * (1 + reps / 30) * 10) / 10
  }
  /* 某动作的三种 PR 口径 */
  function prOf(exId){
    var best = { maxWeight:0, maxVolume:0, best1RM:0, date:'' }
    Store.sessions().forEach(function (sv){
      (sv.sets || []).forEach(function (x){
        if (x.isWarmup || x.exId !== exId) return
        var w = x.weightKg || 0, r = x.reps || 0
        var e1 = est1RM(w, r)
        if (w > best.maxWeight) best.maxWeight = w
        if (w * r > best.maxVolume) best.maxVolume = w * r
        if (e1 > best.best1RM){ best.best1RM = e1; best.date = sv.date }
      })
    })
    return best
  }
  /* 某动作的历史最佳一次（用于训练中「上次」提示） */
  function lastOf(exId){
    var arr = Store.sessions().slice().sort(function (a, b){ return (b.startTs || 0) - (a.startTs || 0) })
    for (var i = 0; i < arr.length; i++){
      var sets = (arr[i].sets || []).filter(function (x){ return x.exId === exId && !x.isWarmup })
      if (sets.length){
        var top = sets.slice().sort(function (a, b){ return (b.weightKg || 0) - (a.weightKg || 0) })[0]
        return { weightKg:top.weightKg, reps:top.reps, sets:sets.length, date:arr[i].date }
      }
    }
    return null
  }
  /* 本次训练是否破了某个动作的 PR（对比该次之前的历史） */
  function prsIn(sv){
    var out = []
    var earlier = Store.sessions().filter(function (x){ return x.id !== sv.id && (x.startTs || 0) < (sv.startTs || 0) })
    var byEx = {}
    ;(sv.sets || []).forEach(function (x){
      if (x.isWarmup) return
      byEx[x.exId] = byEx[x.exId] || []
      byEx[x.exId].push(x)
    })
    Object.keys(byEx).forEach(function (k){
      var bestBefore = 0, bestNow = 0
      earlier.forEach(function (s2){
        (s2.sets || []).forEach(function (x){
          if (!x.isWarmup && x.exId === k) bestBefore = Math.max(bestBefore, est1RM(x.weightKg, x.reps))
        })
      })
      byEx[k].forEach(function (x){ bestNow = Math.max(bestNow, est1RM(x.weightKg, x.reps)) })
      if (bestNow > bestBefore && bestBefore > 0) out.push({ exId:k, name:(byId(k) || {}).name || k, e1rm:bestNow })
    })
    return out
  }
  /* 近 n 周容量趋势 */
  function weeklyVolume(n){
    var out = [], now = Date.now()
    for (var i = n - 1; i >= 0; i--){
      var end = now - i * 7 * 86400000, start = end - 7 * 86400000
      var v = 0
      Store.sessions().forEach(function (sv){
        if ((sv.startTs || 0) >= start && (sv.startTs || 0) < end) v += volumeOf(sv)
      })
      out.push(v)
    }
    return out
  }
  /* 近 n 天肌群占比 —— 按「有效组数」分配（不按容量）。
     否则自重动作（引体/俯卧撑）重量为 0 会被整个忽略，练背的人会看到「背 0%」。 */
  function muscleSplit(n){
    var since = Date.now() - n * 86400000, m = {}
    Store.sessions().forEach(function (sv){
      if ((sv.startTs || 0) < since) return
      ;(sv.sets || []).forEach(function (x){
        if (x.isWarmup) return
        var mu = x.muscle || ((byId(x.exId) || {}).muscle) || '其他'
        m[mu] = (m[mu] || 0) + 1
      })
    })
    var total = Object.keys(m).reduce(function (s, k){ return s + m[k] }, 0) || 1
    return Object.keys(m).map(function (k){ return { muscle:k, pct:Math.round(m[k] / total * 100), sets:m[k] } })
      .sort(function (a, b){ return b.sets - a.sets })
  }
  /* 连续记录天数：每天至少 1 组训练 或 记餐 ≥2 餐；补记可计入 */
  function dayActive(date){
    if (Store.sessionsByDate(date).some(function (sv){ return setCount(sv) > 0 })) return true
    return Store.logs(date).length >= 2
  }
  function streak(){
    var n = 0, d = new Date()
    for (var i = 0; i < 400; i++){
      var key = d.toISOString().slice(0, 10)
      if (dayActive(key)) n++
      else if (i > 0) break
      else if (i === 0) { /* 今天还没记不算断，继续看昨天 */ }
      d.setDate(d.getDate() - 1)
    }
    return n
  }

  return { all:all, byId:byId, byName:byName, muscles:muscles, search:search, altsOf:altsOf,
           addUserEx:addUserEx, delUserEx:delUserEx,
           volumeOf:volumeOf, setCount:setCount, warmupCount:warmupCount, bodyweightSets:bodyweightSets,
           durationMin:durationMin, est1RM:est1RM, prOf:prOf, lastOf:lastOf, prsIn:prsIn,
           weeklyVolume:weeklyVolume, muscleSplit:muscleSplit, streak:streak }
})()

    { key:'strength-full',  title:'全身力量 · 复合',   items:['硬拉 4×8','高位下拉 4×10','深蹲 3×12','平板支撑 3×60 秒'] },
    { key:'mobility',       title:'灵活与核心',        items:['瑜伽流 20 分钟','核心循环 3 轮','泡沫轴放松 10 分钟'] },
    { key:'recovery',       title:'休息恢复',          items:['散步 20–30 分钟','全身拉伸 10 分钟','保证 7 小时睡眠'] }
  ]
  function bmr(p){ return (p.gender === 'm' ? 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age + 5 : 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age - 161) }
  function tdee(p){ return bmr(p) * 1.375 }
  function targetKcal(p, goal){
    var g = GOALS[goal] || GOALS.maintain
    var t = tdee(p) + g.delta
    var floor = p.gender === 'm' ? 1500 : 1200
    return Math.max(floor, Math.round(t / 10) * 10)
  }
  function macros(kcal, goal){
    var g = (GOALS[goal] || GOALS.maintain).p
    return { kcal:kcal, proteinG:Math.round(kcal * g.p / 4), fatG:Math.round(kcal * g.f / 9), carbG:Math.round(kcal * g.c / 4),
      proteinPct:Math.round(g.p * 100), fatPct:Math.round(g.f * 100), carbPct:Math.round(g.c * 100) }
  }
  function pick(arr, i){ return FoodDB.byName(arr[i % arr.length]) }
  function buildMeals(kcal, goal, seed){
    var split = [
      { k:'早餐', p:0.25, mix:[['carb',.42],['protein',.34],['veg',.12],['fruit',.12]] },
      { k:'午餐', p:0.35, mix:[['carb',.40],['protein',.38],['veg',.15],['fat',.07]] },
      { k:'晚餐', p:0.30, mix:[['protein',.40],['veg',.28],['carb',.25],['fat',.07]] },
      { k:'加餐', p:0.10, mix:[['fruit',.5],['protein',.3],['fat',.2]] } ]
    var out = []
    split.forEach(function (m, mi){
      var mk = kcal * m.p, items = [], sum = 0
      m.mix.forEach(function (pair, pi){
        var f = pick(BANK[pair[0]], seed + mi * 3 + pi); if (!f) return
        var want = mk * pair[1]
        var g = Math.round(want / (f.kcal / 100) / 5) * 5
        if (g < 5) g = 5; if (g > 400) g = 400
        var k = FoodDB.calc(f, g)
        items.push(f.name + ' ' + g + 'g'); sum += k
      })
      out.push({ key:m.k, kcal:Math.round(mk), items:items })
    })
    return out
  }
  function build(profile, goal){
    var kcal = targetKcal(profile, goal)
    return { goal:goal, kcal:kcal, macros:macros(kcal, goal), meals:buildMeals(kcal, goal, (profile.age || 1) + profile.weightKg), week:WEEK }
  }
  function goalMeta(goal){ return GOALS[goal] || GOALS.maintain }
  function dayTasks(plan, dowIndex){
    var w = plan.week[dowIndex]
    var isRest = w.key === 'recovery' || w.key === 'mobility'
    return { trainTitle: w.title, trainItems: w.items, isRest:isRest }
  }
  return { build:build, goalMeta:goalMeta, dayTasks:dayTasks, GOALS:GOALS, targetKcal:targetKcal, tdee:tdee }
})()

var AI = (function () {
  var PROMPT = '你是食物识别助手。识别图片中的食物，返回 JSON 数组，每项形如 {"name":"食物名","grams":估重克数,"kcal":每100克热量}。无法识别时返回 []。只返回 JSON，不要多余文字。'
  var PRESETS = [
    { name:'OpenAI', baseUrl:'https://api.openai.com/v1/chat/completions', model:'gpt-4o-mini' },
    { name:'通义千问', baseUrl:'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model:'qwen-vl-plus' },
    { name:'SiliconFlow', baseUrl:'https://api.siliconflow.cn/v1/chat/completions', model:'Qwen/Qwen2.5-VL-72B-Instruct' }
  ]
  function configured(){ var c = Store.aiCfg(); return !!(c && c.apiKey && c.baseUrl) }
  function recognize(dataUrl, cb, err){
    var c = Store.aiCfg()
    if (!c || !c.apiKey){ err('未配置识别密钥'); return }
    /* APK 内通过原生桥发请求，规避 WebView 的跨域限制 */
    if (typeof window !== 'undefined' && window.AndroidAI && window.AndroidAI.recognize){
      var res
      try { res = window.AndroidAI.recognize(dataUrl, c.baseUrl, c.model || 'gpt-4o-mini', c.apiKey) } catch (e) { err('识别失败'); return }
      if (res && res.indexOf('__ERR__') === 0){ err(res.slice(7)); return }
      if (!res){ err('识别无结果'); return }
      cb(parseFoods(res))
      return
    }
    var url = c.baseUrl
    if (url.indexOf('/chat/completions') < 0) url = url.replace(/\/+$/, '') + '/chat/completions'
    var body = { model:c.model || 'gpt-4o-mini', messages:[{ role:'user', content:[
      { type:'text', text:PROMPT },
      { type:'image_url', image_url:{ url:dataUrl } } ] }], max_tokens:600, temperature:0 }
    try {
      fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + c.apiKey }, body:JSON.stringify(body) })
        .then(function (r){ if (!r.ok) return r.text().then(function (t){ throw new Error('HTTP ' + r.status + ' ' + t.slice(0, 120)) }); return r.json() })
        .then(function (j){
          var txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content
          if (!txt){ err('识别无结果'); return }
          cb(parseFoods(txt))
        })
        .catch(function (e){ err(e && e.message ? e.message : '识别请求失败') })
    } catch (e){ err('请求异常') }
  }
  function parseFoods(txt){
    txt = String(txt).trim()
    txt = txt.replace(/^```(json)?/i, '').replace(/```$/, '').trim()
    var s = txt.indexOf('['), e = txt.lastIndexOf(']')
    if (s >= 0 && e > s) txt = txt.slice(s, e + 1)
    try {
      var arr = JSON.parse(txt)
      if (!Array.isArray(arr)) return []
      return arr.filter(function (x){ return x && x.name }).map(function (x){ return { name:String(x.name), grams:(x.grams && x.grams > 0) ? Math.round(x.grams) : null, kcal:(x.kcal && x.kcal > 0) ? Math.round(x.kcal) : null } })
    } catch (e) { return [] }
  }
  return { PRESETS:PRESETS, configured:configured, recognize:recognize, parseFoods:parseFoods }
})()

/* ------------------------------ 免费本地识餐（纯算法，离线无需密钥） ------------------------------
   对图片做 32×32 采样，按颜色分布（白/黄/绿/红/棕）猜出候选食物，返回候选列表供点选。
   不准？没关系——这是"免费算法"通道，点一下确认即可；想要精准自动识别可在设置里填 AI 密钥。 */
var LocalVision = (function () {
  function analyze(dataUrl, cb){
    var img = new Image()
    img.onload = function () {
      try {
        var w = 32, h = 32
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h
        var ctx = cv.getContext('2d')
        ctx.drawImage(img, 0, 0, w, h)
        var d = ctx.getImageData(0, 0, w, h).data
        var stat = { white:0, yellow:0, green:0, red:0, brown:0, total:w * h }
        for (var i = 0; i < d.length; i += 4){
          var r = d[i], g = d[i + 1], b = d[i + 2]
          var mx = Math.max(r, g, b), mn = Math.min(r, g, b), df = mx - mn
          var h = 0, s = 0, v = mx / 255
          if (df > 0){
            s = df / mx
            var rr = (mx - r) / df, gg = (mx - g) / df, bb = (mx - b) / df
            if (r === mx) h = (gg - bb) % 6 / 6; else if (g === mx) h = (2 + bb - rr) / 6; else h = (4 + rr - gg) / 6
            if (h < 0) h += 1
          }
          if (v > 0.9 && s < 0.18) stat.white++
          else if (h >= 0.08 && h < 0.18 && s > 0.4 && v > 0.5) stat.yellow++
          else if (h >= 0.22 && h < 0.45 && s > 0.22) stat.green++
          else if ((h < 0.03 || h >= 0.95) && s > 0.35 && v > 0.4) stat.red++
          else if (h >= 0.03 && h < 0.13 && s > 0.3 && v >= 0.2 && v < 0.88) stat.brown++
        }
        cb(guess(stat))
      } catch (e) { cb([]) }
    }
    img.onerror = function () { cb([]) }
    img.src = dataUrl
  }
  function guess(stat){
    var out = []
    function add(name, score){ if (out.length < 8) out.push({ name:name, conf:Math.round(Math.min(92, 35 + Math.max(0, score) * 55)) }) }
    var pct = {}
    ;['white', 'yellow', 'green', 'red', 'brown'].forEach(function (k){ pct[k] = stat[k] / stat.total })
    if (pct.white > 0.25){ add('白米饭', pct.white * 1.5); add('白粥', pct.white * 1.15); add('馒头', pct.white * 0.95); add('牛奶(全脂)', pct.white * 0.7); add('饺子(素)', pct.white * 0.6) }
    if (pct.yellow > 0.15){ add('鸡蛋', pct.yellow * 1.5); add('玉米(鲜)', pct.yellow * 1.2); add('香蕉', pct.yellow * 0.9); add('芒果', pct.yellow * 0.7) }
    if (pct.green > 0.2){ add('西兰花', pct.green * 1.5); add('菠菜', pct.green * 1.15); add('黄瓜', pct.green * 0.95); add('生菜', pct.green * 0.8); add('韭菜', pct.green * 0.65) }
    if (pct.red > 0.15){ add('番茄', pct.red * 1.5); add('西瓜', pct.red * 1.05); add('苹果', pct.red * 0.9); add('草莓', pct.red * 0.7); add('樱桃', pct.red * 0.55) }
    if (pct.brown > 0.2){ add('鸡胸肉', pct.brown * 1.4); add('牛里脊', pct.brown * 1.1); add('红烧肉', pct.brown * 0.95); add('全麦面包', pct.brown * 0.8); add('巧克力', pct.brown * 0.65) }
    if (!out.length){ add('鸡胸肉', 1); add('白米饭', 1); add('苹果', 1); add('西兰花', 1) }
    /* 去重 + 按置信度排序 */
    var seen = {}, uniq = []
    out.forEach(function (x){ if (!seen[x.name]){ seen[x.name] = 1; uniq.push(x) } })
    uniq.sort(function (a, b){ return b.conf - a.conf })
    return uniq.slice(0, 6)
  }
  return { analyze:analyze }
})()

  function ready(){ return !!session }

    return new Promise(function (res, rej){
      var s = document.createElement('script')
      s.src = 'ort.min.js'
      s.onload = function (){ res() }
      s.onerror = function (){ rej(new Error('推理引擎加载失败')) }

      try {

  function preprocess(dataUrl, cb, err){
    var img = new Image()
    img.onload = function () {
      var S = 224
      var cv = document.createElement('canvas'); cv.width = S; cv.height = S
      var ctx = cv.getContext('2d')
      var sc = Math.max(S / img.width, S / img.height)
      var dw = img.width * sc, dh = img.height * sc
      ctx.drawImage(img, (S - dw) / 2, (S - dh) / 2, dw, dh)
      var d = ctx.getImageData(0, 0, S, S).data
      var mean = [0.485, 0.456, 0.406], std = [0.229, 0.224, 0.225]
      var out = new Float32Array(3 * S * S), area = S * S
      for (var i = 0; i < area; i++){
        out[i]             = (d[i*4]     / 255 - mean[0]) / std[0]
        out[i + area]      = (d[i*4 + 1] / 255 - mean[1]) / std[1]
        out[i + area * 2]  = (d[i*4 + 2] / 255 - mean[2]) / std[2]
      }

  }

    var mx = Math.max.apply(null, logits)

    for (var i = 0; i < logits.length; i++) sum += Math.exp(logits[i] - mx)
    var idx = logits.map(function (v, i){ return i }).sort(function (a, b){ return logits[b] - logits[a] }).slice(0, k)

  act: function (a, v, el){

    if (a === 'import'){ this.importData(); return }

    if (a === 'trW'){ this._t.weight = Math.max(0, +(+this._t.weight + (+v)).toFixed(1)); this.render(); return }
    if (a === 'trR'){ this._t.reps = Math.max(1, this._t.reps + (+v)); this.render(); return }
    if (a === 'trWarm'){ this._t.warmup = !this._t.warmup; this.render(); return }
    if (a === 'addSet'){ this.addSet(); return }
    if (a === 'finishTrain'){ this.finishTraining(); return }
    if (a === 'switchEx'){ this.open('picker'); return }
    if (a === 'startTrain'){ this.startTraining(); return }
    if (a === 'heat'){ this.open('bodyheat'); return }
    if (a === 'cal'){ this.open('cal'); return }
    if (a === 'foodlib'){ this.open('foodlib'); return }
    if (a === 'body'){ this.open('body'); return }
    if (a === 'calendar'){ this.open('calendar'); return }
    if (a === 'about'){ this.open('about'); return }
    if (a === 'settings'){ this.open('settings'); return }
    if (a === 'onbNext'){ this.onbNext(); return }
    if (a === 'onbPrev'){ this.state._onboard = Math.max(0, this.state._onboard - 1); this.render(); return }
    if (a === 'onbSkip'){ this.onbSkip(); return }
    if (a === 'mealAdd'){ this.open('cal'); return }
    if (a === 'recordBody'){ this.open('body'); return }
    if (a === 'planAdj'){ toast('已加入今日计划'); return }
    if (a === 'seg'){ this.state._seg = v; this.render(); return }
    if (a === 'trCat'){ this._trCat = v; this.render(); return }
    if (a === 'foodCat'){ this.state._foodCat = v; this.render(); return }
    if (a === 'exDetail'){ this._trBody = v; this.open('exdetail'); return }
    if (a === 'useEx'){ this.pickEx(v, true); return }
    if (a === 'foodSel'){ this.openFoodSheet(v); return }
    if (a === 'calMeal'){ this.state._calMeal = v; this.openFoodSheet(null); return }
    if (a === 'saveFood'){ this.saveFoodSheet(); return }
    if (a === 'closeSheet'){ this.closeSheet(); return }
    if (a === 'delLog'){ Store.delLog(todayISO(), v); this.render(); toast('已删除'); return }

    if (a === 'recog'){ this.startRecog(); return }
    if (a === 'chooseRecog'){ this.chooseRecog(v); return }
    if (a === 'prEx'){ this._prEx = v; this.render(); return }
    if (a === 'prSeg'){ this._prSeg = v; this.render(); return }
    if (a === 'onbGender'){ this.state._onboardProfile.gender = v; this.render(); return }
    if (a === 'onbPlan'){ this.state._onboardPlan = v; this.render(); return }
    if (a === 'grams'){ this._foodGrams = Math.max(10, (this._foodGrams || 100) + (+v)); this.rerenderSheet(); return }
    if (a === 'foodPick'){ var f = FoodDB.byName(v); if (f){ this._food = f; this._foodGrams = f.def } this.rerenderSheet(); return }
    if (a === 'foodSel'){ this.openFoodSheet(v); return }

    if (a === 'newEx'){ this.newEx(); return }

  /* ---------- 主渲染 ---------- */
  render: function (){
    var s = this.state.screen
    var head = this.sb()
    var body = ''
    if (s === 'today') body = this.renderToday()
    else if (s === 'log') body = this.renderLog()
    else if (s === 'plan') body = this.renderPlan()
    else if (s === 'me') body = this.renderMe()
    else if (s === 'train') body = this.renderTrain()
    else if (s === 'picker') body = this.renderPicker()
    else if (s === 'exdetail') body = this.renderExDetail()
    else if (s === 'summary') body = this.renderSummary()
    else if (s === 'cal') body = this.renderCal()
    else if (s === 'foodlib') body = this.renderFoodLib()
    else if (s === 'calendar') body = this.renderCalendar()
    else if (s === 'pr') body = this.renderPr()
    else if (s === 'bodyheat') body = this.renderBodyHeat()
    else if (s === 'body') body = this.renderBody()
    else if (s === 'settings') body = this.renderSettings()
    else if (s === 'about') body = this.renderAbout()
    else if (s === 'onboard') body = this.renderOnboard()
    else body = this.renderToday()

    var isTab = (s === 'today' || s === 'log' || s === 'plan' || s === 'me')
    var page = '<div class="page">' + head + body + (isTab ? this.tabbar() : '') + '</div>'
    var app = document.getElementById('app')
    app.innerHTML = page + (this._sheet ? this.sheetHTML() : '')
    if (isTab) Glider.sync(false)
    this.afterRender()
  },
  afterRender: function (){
    var s = this.state.screen
    if (s === 'train') this.startTicker()
    if (s === 'picker') this.fillBodyFigure('trFigA', 'trFigP')

  },

  dietCard: function (today){
    var keys = ['breakfast', 'lunch', 'dinner']
    var plan = Store.plan()
    var target = plan ? plan.kcal : 2000
    var kcal = sumKcal(today)
    var pct = Math.min(100, Math.round(kcal / target * 100))
    var h = '<div class="sec"><h2>饮食</h2><div class="card">'
    h += '<div style="padding:14px 16px 12px"><div style="display:flex;align-items:baseline;gap:6px"><span class="num" style="font-size:23px;font-weight:700;letter-spacing:-.5px">' + num(kcal) + '</span><span style="font-size:13px;color:var(--t2)">/ ' + num(target) + ' kcal</span><span style="margin-left:auto;font-size:12.5px;color:var(--t2)">' + (kcal < target ? '还差 ' + num(target - kcal) : '已超 ' + num(kcal - target)) + '</span></div><div class="bar" style="margin-top:10px"><i style="width:' + pct + '%"></i></div></div>'
    h += '<div class="rows" style="padding:0 16px 4px">'
    keys.forEach(function (k){
      var m = AppCfg.mealMeta(k)
      var kk = sumKcal(today + '') /* placeholder */
      var mealKcal = Store.logs(today).filter(function (x){ return x.meal === k }).reduce(function (s, x){ return s + (+x.kcal || 0) }, 0)
      var foods = Store.logs(today).filter(function (x){ return x.meal === k })
      var label = mealKcal > 0 ? (foods[0] ? foods[0].name : '') + ' · ' + mealKcal + ' kcal' : '记餐 / 拍照识餐'
      if (mealKcal > 0){
        h += '<div class="row" data-act="calMeal" data-v="' + k + '"><span class="ic acc">' + icn('i-check', 16) + '</span><span class="mid"><b>' + m.label + '</b><span>' + esc(label) + '</span></span><span class="chev"></span></div>'
      } else {
        h += '<div class="row" data-act="calMeal" data-v="' + k + '"><span class="ic">' + icn('i-camera', 16) + '</span><span class="mid"><b style="color:var(--t2)">' + m.label + '</b><span>' + m.start + '–' + m.end + ' 记餐</span></span><span class="chev"></span></div>'
      }
    })
    h += '</div></div></div>'
    return h

  /* ================= 记录 ================= */
  renderLog: function (){
    var h = '<div class="scroll"><div class="hero" style="padding-bottom:12px"><h1>记录</h1><p>训练 · 饮食 · 身体数据，都在本机</p></div>'

    }
    return out

      })
    }
    if (seg === 'all' || seg === 'food'){
      var logs = Store.logs(date)
      var kk = logs.reduce(function (s, x){ return s + (+x.kcal || 0) }, 0)
      if (logs.length){
        h += '<div class="row"><span class="ic acc">' + icn('i-flame', 16) + '</span><span class="mid"><b>饮食</b><span>' + logs.length + ' 项 · 蛋白 ' + num(sumP(date, 'proteinG')) + 'g · 碳水 ' + num(sumP(date, 'carbG')) + 'g</span></span><span class="val num">' + num(kk) + '<i style="font-size:11px;font-style:normal;color:var(--t3);margin-left:1px">kcal</i></span><span class="chev"></span></div>'

        h += '<div class="row"><span class="ic">' + icn('i-trend', 16) + '</span><span class="mid"><b>体脂率</b><span>围度法 · 腰围 ' + r.waistCm + 'cm</span></span><span class="val num">' + fmt(r.bf, 1) + '%</span><span class="chev"></span></div>'
      })
    }
    return h
  },

  /* ================= 计划 ================= */
  renderPlan: function (){
    var plan = Store.plan()
    if (!plan){
      return '<div class="scroll"><div class="hero" style="padding-bottom:12px"><h1>计划</h1><p>先录身体数据，生成你的专属计划</p></div><div class="pad">'
        + '<div class="card" style="padding:24px 20px;text-align:center"><div class="empty" style="padding:10px 0 6px"><div class="ico">' + icn('i-target', 28) + '</div><h2>还没有计划</h2><p>录入身体数据后，会按你的目标自动生成热量与训练安排。</p></div><button class="btn" style="margin-top:8px" data-act="recordBody">录入身体数据</button></div></div></div>'
    }
    var gm = PlanEngine.goalMeta(plan.goal)
    var wk = this.weekIndex(plan)
    var done = this.weekDone(plan)
    var d = new Date(), dow = weekdayIndex(d)
    var h = '<div class="scroll"><div class="hero" style="padding-bottom:12px"><h1>计划</h1><p>' + gm.title + '期 · 每周 ' + this.weeklyCount(plan) + ' 练 · 目标 ' + num(plan.kcal) + ' kcal</p></div><div class="pad">'

    /* 本周进度 */
    h += '<div class="card" style="padding:15px 16px"><div style="display:flex;align-items:baseline;gap:6px"><span class="num" style="font-size:23px;font-weight:700;letter-spacing:-.5px">' + done + '</span><span style="font-size:13px;color:var(--t2)">/ ' + this.weeklyCount(plan) + ' 次训练完成</span><span style="margin-left:auto;font-size:12.5px;color:var(--t2)">' + (done >= this.weeklyCount(plan) ? '本周完成' : '还剩 ' + (this.weeklyCount(plan) - done) + ' 次') + '</span></div>'
    h += '<div style="display:flex;gap:8px;margin-top:14px">'
    for (var i = 0; i < 7; i++){
      var cls = 'dot num'
      if (i < dow) cls += ' done'; else if (i === dow) cls += ' today'
      h += '<span class="' + cls + '">' + (i + 1) + '</span>'
    }
    h += '</div></div>'

  tileStat: function (v, u, label){
    return '<div><div class="num" style="font-size:19px;font-weight:700;letter-spacing:-.4px">' + v + '<i style="font-size:11px;font-style:normal;font-weight:600;color:var(--t3)">' + u + '</i></div><div style="font-size:11.5px;color:var(--t2);margin-top:3px">' + label + '</div></div>'
  },
  volumeChart: function (){
    var data = Train.weeklyVolume(8)
    var max = Math.max.apply(null, data.concat([1]))
    var W = 326, H = 86, base = H - 8
    var pts = data.map(function (v, i){ return { x: Math.round(i * W / 7), y: Math.round(base - (v / max) * (base - 8)) } })
    var line = pts.map(function (p){ return (p === pts[0] ? 'M' : 'L') + p.x + ' ' + p.y }).join(' ')
    var area = line + ' L' + W + ' ' + base + ' L0 ' + base + ' Z'
    var last = pts[pts.length - 1]
    return '<svg viewBox="0 0 326 86" style="width:100%;height:auto;color:var(--accent);display:block"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".26"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><path d="' + area + '" fill="url(#ga)"/><path d="' + line + '" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="' + last.x + '" cy="' + last.y + '" r="4" fill="currentColor" stroke="var(--surface)" stroke-width="2.4"/></svg>'
      + '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:2px"><span>8周前</span><span>4周前</span><span>本周</span></div>'
  },

  /* ================= 训练 ================= */
  startTraining: function (){
    var act = Store.activeSession()
    if (act){ this._t.s = act; this._t.exId = null; this.open('picker'); return }
    var now = Date.now()
    var s = { id:'s' + now, date: new Date().toISOString().slice(0, 10), startTs: now, sets:[] }
    Store.setActiveSession(s); this._t.s = s; this._t.exId = null
    this._trQ = ''; this._trCat = ''
    this.open('picker')
  },
  pickEx: function (exId, fromDetail){
    var e = Train.byId(exId); if (!e) return
    var last = Train.lastOf(exId)
    this._t.exId = exId
    this._t.weight = (last && last.weightKg) || (e.equip === '自重' ? 0 : 60)
    this._t.reps = (last && last.reps) || 8
    this._t.warmup = false
    if (!this._t.s){ var now = Date.now(); this._t.s = { id:'s' + now, date:new Date().toISOString().slice(0, 10), startTs:now, sets:[] }; Store.setActiveSession(this._t.s) }
    this.state.prev = null
    this.state.screen = 'train'
    this.render()
  },
  renderTrain: function (){
    var t = this._t
    if (!t.s || !t.exId){ return this.renderTrainEmpty() }
    var e = Train.byId(t.exId)
    var sv = t.s
    var done = (sv.sets || []).filter(function (x){ return x.exId === t.exId })
    var now = new Date()
    var el = Math.max(0, Math.floor(((sv.startTs || Date.now()) - Date.now()) / 1000))
    var dur = this.fmtDur(Date.now() - (sv.startTs || Date.now()))
    var restLeft = Math.max(0, Math.round((t.restUntil - Date.now()) / 1000))
    var h = '<div class="backnav" style="background:transparent;border-bottom:0"><span class="bk" style="flex:0 0 56px" data-act="finishTrain">结束</span><span class="num" style="flex:1;text-align:center;font-size:15px;font-weight:600">' + dur + '</span><span style="flex:0 0 56px;display:flex;justify-content:flex-end">' + icn('i-more', 18) + '</span></div>'
    h += '<div class="scroll" style="padding-bottom:20px"><div class="hero" style="padding-top:2px"><h1>' + esc(e.name) + '</h1><p>' + e.muscle + ' · ' + e.equip + (e.rec ? ' · 建议 ' + e.rec : '') + '</p></div><div class="pad">'

    h += '<div class="card" style="padding:6px 16px">'
    var lastSet = null
    done.forEach(function (st, i){
      h += '<div style="display:flex;align-items:center;padding:10px 0' + (i ? ';border-top:.5px solid var(--hairline)' : '') + '"><span class="num" style="width:56px;font-size:13.5px;color:var(--t3)">第 ' + (i + 1) + ' 组</span><span class="num" style="flex:1;font-size:16px;font-weight:500">' + wkg(st.weightKg) + ' kg × ' + st.reps + (st.isWarmup ? ' · 热身' : '') + '</span>' + icn('i-check', 17) + '</div>'
      lastSet = st

      h += '<div style="display:flex;align-items:center;padding:11px 12px;margin:0 -8px 8px;background:var(--accent-soft);border-radius:12px"><span class="num" style="width:56px;font-size:13.5px;color:var(--accent);font-weight:600">休息</span><span style="flex:1;font-size:14px;color:var(--t2)">组间休息 ' + restLeft + ' 秒</span></div>'
    } else {
      h += '<div style="display:flex;align-items:center;padding:11px 12px;margin:0 -8px 8px;background:var(--accent-soft);border-radius:12px"><span class="num" style="width:56px;font-size:13.5px;color:var(--accent);font-weight:600">第 ' + (done.length + 1) + ' 组</span><span style="flex:1;font-size:14px;color:var(--t2)">准备开始…</span></div>'
    }

    h += '<div class="stepline" style="margin-bottom:10px"><span class="lb">重量</span><span class="stepper" style="flex:1"><button data-act="trW" data-v="-2.5">−</button><span class="v num">' + wkg(t.weight) + '<u>kg</u></span><button data-act="trW" data-v="2.5">+</button></span></div>'
    h += '<div class="stepline"><span class="lb">次数</span><span class="stepper" style="flex:1"><button data-act="trR" data-v="-1">−</button><span class="v num">' + t.reps + '<u>次</u></span><button data-act="trR" data-v="1">+</button></span></div>'
    h += '<div style="display:flex;gap:8px;margin-top:8px;padding-left:50px"><span class="chip" style="height:28px;font-size:12px;padding:0 11px" data-act="trWarm">' + (t.warmup ? '热身组 ✓' : '热身组') + '</span><span class="chip" style="height:28px;font-size:12px;padding:0 11px">力竭</span></div>'
    h += '</div>'

    /* 组间休息 */
    h += '<div class="card" style="margin-top:16px;padding:12px 14px;display:flex;align-items:center;gap:12px"><span style="width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none">' + icn('i-timer', 18) + '</span><span style="flex:1;min-width:0"><b style="display:block;font-size:14px;font-weight:500">组间休息 · 90 秒</b><span class="bar thin" style="display:block;margin-top:8px"><i style="width:' + (restLeft > 0 ? Math.round((1 - restLeft / 90) * 100) : 0) + '%"></i></span></span><span class="num" style="font-size:21px;font-weight:700;letter-spacing:-.4px">' + (restLeft > 0 ? '0:' + pad(restLeft) : '1:30') + '</span></div>'

    h += '<button class="btn" style="margin-top:16px;height:54px;border-radius:16px;font-size:17px" data-act="addSet">' + icn('i-check', 18) + '完成本组</button>'

    /* 本场接下来 */
    var upcoming = (sv.sets || []).map(function (x){ return x.exId }).filter(function (id, i, a){ return a.indexOf(id) === i }).filter(function (id){ return id !== t.exId })
    if (upcoming.length){
      h += '<div class="sec" style="margin-top:20px"><h2>本场接下来</h2><div class="card"><div class="rows">'
      upcoming.forEach(function (id){ var ex = Train.byId(id); if (!ex) return; h += '<div class="row" data-ex="' + id + '"><span class="ic">' + icn('i-dumbbell', 16) + '</span><span class="mid"><b>' + esc(ex.name) + '</b><span>' + ex.muscle + ' · ' + ex.equip + '</span></span><span class="chev"></span></div>' })
      h += '</div></div></div>'
    }
    h += '</div></div>'
    return h
  },
  renderTrainEmpty: function (){

    var h = '<div class="scroll"><div class="hero" style="padding-bottom:12px"><h1>训练</h1><p>记组 + 计时 + 容量统计</p></div><div class="pad">'

    h += '</div></div>'

  },
  addSet: function (){
    var t = this._t, e = Train.byId(t.exId); if (!e) return
    t.s.sets = t.s.sets || []
    t.s.sets.push({ exId:t.exId, name:e.name, muscle:e.muscle, weightKg:+t.weight || 0, reps:t.reps, isWarmup:t.warmup, doneAt:Date.now() })
    Store.setActiveSession(t.s)
    t.restUntil = Date.now() + 90000
    var self = this
    clearInterval(t.restTimer)
    t.restTimer = setInterval(function (){ if (self.state.screen === 'train') self.render() }, 1000)
    toast('已记录第 ' + (t.s.sets.filter(function (x){ return x.exId === t.exId }).length) + ' 组')
    this.render()
  },
  finishTraining: function (){
    var t = this._t
    clearInterval(t.restTimer); t.restTimer = null
    if (!t.s || !t.s.sets.length){ Store.setActiveSession(null); t.s = null; this.state.prev = null; this.state.screen = 'today'; this.render(); toast('已取消（无记录）'); return }
    t.s.endTs = Date.now()
    Store.saveSession(t.s); Store.setActiveSession(null)
    var sv = t.s; t.s = null
    this._summary = sv
    this.state.prev = null
    this.state.screen = 'summary'
    this.render()
  },
  fmtDur: function (ms){ var s = Math.floor(ms / 1000); var m = Math.floor(s / 60), ss = s % 60, hh = Math.floor(m / 60); m = m % 60; return pad(hh) + ':' + pad(m) + ':' + pad(ss) },
  startTicker: function (){ /* 渲染自带 rest interval，无需额外 */ },

  fillBodyFigure: function (aId, pId){

    ;(sv.sets || []).forEach(function (st){

    return out

    var bf = Engine.navy(p.gender, p.waistCm, p.neckCm, p.hipCm, p.heightCm)
    if (!isFinite(bf)) bf = p.gender === 'm' ? 20 : 28
    Store.addRecord({ id:uid(), ts:Date.now(), gender:p.gender, age:p.age, heightCm:p.heightCm, weightKg:p.weightKg, waistCm:p.waistCm, neckCm:p.neckCm, hipCm:p.hipCm, method:'navy', bf:bf, bmi:Engine.bmi(p.weightKg, p.heightCm) })

      plan.snapshot = { bf:bf, weightKg:p.weightKg, gender:p.gender, adoptedAt:Date.now() }
      Store.savePlan(plan)
    }
    var c = Store.cfg() || {}; c.onboarded = true; Store.saveCfg(c)

  /* ================= 食物记餐（底部弹层） ================= */

        h += '<div style="text-align:center;font-size:13px;color:var(--t2);margin-top:10px">约 <b class="num" style="color:var(--t1)">' + kcal + '</b> kcal</div>'

      } else {
        h += '<div style="display:flex;align-items:center;gap:9px;height:44px;margin-top:12px;padding:0 12px;background:var(--surface-2);border-radius:11px;border:.5px solid var(--hairline)">' + icn('i-search', 16) + '<input class="inp" id="foodSearch" style="flex:1;height:auto;border:0;background:transparent;padding:0" placeholder="搜索食物" oninput="App._foodQ2=this.value;App.refreshFoodList()"></div>'
        h += '<div id="foodList" style="margin-top:12px">' + self.foodListHTML() + '</div>'
      }
      h += '</div>'

    }

  foodListHTML: function (){
    var list = FoodDB.search(this._foodQ2 || '', null).slice(0, 12)
    return list.map(function (f){ return '<div class="row" data-act="foodPick" data-v="' + f.name + '"><span class="mid"><b>' + esc(f.name) + '</b><span>' + f.cat + ' · ' + f.def + 'g</span></span><span class="val num">' + FoodDB.calc(f, f.def) + '</span><span class="chev"></span></div>' }).join('')
  },
  refreshFoodList: function (){
    var el = document.getElementById('foodList'); if (el) el.innerHTML = this.foodListHTML()
  },
  saveFoodSheet: function (){
    var f = this._food; if (!f) return
    var g = this._foodGrams
    var kcal = FoodDB.calc(f, g)
    var item = { id:uid(), ts:Date.now(), name:f.name, grams:g, kcal:kcal, meal:this._foodMeal || AppCfg.currentMeal(),
      proteinG: f.p ? Math.round(f.p * g / 100) : 0, carbG: f.c ? Math.round(f.c * g / 100) : 0, fatG: f.f ? Math.round(f.f * g / 100) : 0 }
    Store.addLog(todayISO(), item)
    this._food = null
    this.closeSheet()
    if (this.state.screen === 'cal') this.render(); else { this.state.screen = 'cal'; this.render() }
    toast('已记 ' + f.name + ' ' + kcal + ' kcal')
  },
  startRecog: function (){
    var self = this
    var inp = document.createElement('input')
    inp.type = 'file'; inp.accept = 'image/*'
    inp.onchange = function (){
      var file = inp.files && inp.files[0]; if (!file) return
      var reader = new FileReader()
      reader.onload = function (e){
        var dataUrl = e.target.result
        if (FoodAI.ready || typeof ort !== 'undefined'){
          FoodAI.load().then(function (){
            FoodAI.recognize(dataUrl, function (res){ self.showRecog(dataUrl, res.top5) }, function (err){ self.showLocalVision(dataUrl) })
          }).catch(function (){ self.showLocalVision(dataUrl) })
        } else {
          self.showLocalVision(dataUrl)
        }
      }
      reader.readAsDataURL(file)
    }
    inp.click()
  },
  showLocalVision: function (dataUrl){
    var self = this
    LocalVision.analyze(dataUrl, function (cands){ self.showRecog(dataUrl, cands.map(function (c){ return { name:c.name, p:c.conf } })) })
  },
  showRecog: function (dataUrl, top){
    var self = this
    var meal = this.state._calMeal || AppCfg.currentMeal()
    this._sheet = function (){
      var h = '<div class="grab"></div><div style="padding:4px 16px 0"><div style="font-size:15px;font-weight:600">识别结果</div><div style="font-size:12.5px;color:var(--t2);margin-top:2px">点选最接近的一项</div><div id="recogList" style="margin-top:10px">'
      top.slice(0, 6).forEach(function (t){
        var f = FoodDB.byName(t.name) || FoodDB.ensure(t.name, null, '其他', 100)
        h += '<div class="row" data-act="chooseRecog" data-v="' + t.name + '"><span class="mid"><b>' + esc(t.name) + '</b><span>' + f.cat + ' · ' + FoodDB.calc(f, f.def) + ' kcal / ' + f.def + 'g</span></span><span class="val num" style="color:var(--accent)">' + (t.p || '') + '%</span><span class="chev"></span></div>'
      })
      h += '</div></div>'
      return h
    }
    this.renderSheet()
  },
  chooseRecog: function (name){
    var f = FoodDB.byName(name)
    if (!f) return
    this.closeSheet()
    this._food = f; this._foodMeal = AppCfg.currentMeal(); this._foodGrams = f.def
    this.saveFoodSheet()
  },

      var reader = new FileReader()
      reader.onload = function (e){
        try { var data = JSON.parse(e.target.result); if (Store.importAll(data)){ toast('导入成功'); self.render() } else toast('备份格式不正确') }
        catch (err){ toast('备份解析失败') }
      }
      reader.readAsText(file)
    }
    inp.click()
  },
  clearAll: function (){
    if (confirm('确定清空全部数据？此操作不可撤销。')){ Store.clearAll(); this.state.preview = null; this.render(); toast('已清空') }
  }
}

/* ---------- 训练量分档 ---------- */
function trTier(muscle, sets){
  var big = (muscle === '胸' || muscle === '背' || muscle === '腿')
  var lo = big ? 10 : 6, hi = big ? 20 : 14
  if (sets === 0) return 'none'
  var over = hi * 1.3
  if (sets >= over) return 'over'
  if (sets >= lo) return 'full'
  if (sets >= lo * 0.55) return 'mid'
  return 'light'
}

/* ---------- 事件委托 ---------- */
document.addEventListener('click', function (ev){
  var el = ev.target.closest ? ev.target.closest('[data-go],[data-open],[data-back],[data-act],[data-ex]') : null
  if (!el) return
  if (el.hasAttribute('data-go')){ App.go(el.getAttribute('data-go')); return }
  if (el.hasAttribute('data-back')){ App.back(); return }
  if (el.hasAttribute('data-act')){ App.act(el.getAttribute('data-act'), el.getAttribute('data-v'), el); return }
  if (el.hasAttribute('data-ex')){ App.pickEx(el.getAttribute('data-ex')); return }
  if (el.hasAttribute('data-open')){ App.open(el.getAttribute('data-open')); return }
})

/* ---------- 启动 ---------- */
function init(){
  var app = document.getElementById('app')
  if (document.getElementById('sprite')) document.getElementById('sprite').remove()
  var svg = document.createElement('div')
  svg.id = 'sprite'
  svg.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden'
  svg.innerHTML = SPRITE
  document.body.insertBefore(svg, document.body.firstChild)

  var c = Store.cfg() || {}
  if (!c.onboarded && !Store.plan() && !Store.records().length){
    App.state.screen = 'onboard'
  }
  FoodDB.loadExtra()
  App.render()
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init()

</script>
