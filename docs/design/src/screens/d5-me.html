<!DOCTYPE html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><title>05 我的</title>
<link rel="stylesheet" href="../fitnote.css"></head><body>
<script src="../sprite.js"></script>
<script src="../chrome.js"></script>
<script>document.write(SB())</script>

<div class="nav">
  <span style="font-size:13px;color:var(--t2)">我的</span>
  <span class="ops"><span class="iconbtn" style="background:transparent;border:0"><svg><use href="#i-sun"/></svg></span></span>
</div>

<div class="scroll">
  <div class="hero" style="padding-bottom:12px">
    <h1>我的</h1>
    <p>身高 178 · 体重 72.5 · 目标增肌</p>
  </div>

  <div class="pad">
    <!-- 身体档案 -->
    <div class="card" style="padding:0">
      <div class="ttl">身体档案</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);padding:0 16px 15px;gap:8px">
        <div><div class="num" style="font-size:19px;font-weight:700;letter-spacing:-.4px">178<i style="font-size:11px;font-style:normal;font-weight:600;color:var(--t3)">cm</i></div>
          <div style="font-size:11.5px;color:var(--t2);margin-top:3px">身高</div></div>
        <div><div class="num" style="font-size:19px;font-weight:700;letter-spacing:-.4px">72.5<i style="font-size:11px;font-style:normal;font-weight:600;color:var(--t3)">kg</i></div>
          <div style="font-size:11.5px;color:var(--t2);margin-top:3px">体重</div></div>
        <div><div class="num" style="font-size:19px;font-weight:700;letter-spacing:-.4px">82<i style="font-size:11px;font-style:normal;font-weight:600;color:var(--t3)">cm</i></div>
          <div style="font-size:11.5px;color:var(--t2);margin-top:3px">腰围</div></div>
        <div><div class="num" style="font-size:19px;font-weight:700;letter-spacing:-.4px">22.4<i style="font-size:11px;font-style:normal;font-weight:600;color:var(--t3)">%</i></div>
          <div style="font-size:11.5px;color:var(--t2);margin-top:3px">体脂率</div></div>
      </div>
    </div>

    <!-- 数据方块 -->
    <div class="sec"><h2>本月概览</h2>
      <div class="tiles">
        <div class="tile"><b class="num">14,260<i>kg</i></b><span>本周容量</span></div>
        <div class="tile"><b class="num">3<i>次</i></b><span>本月 PR 突破</span></div>
        <div class="tile on"><b class="num">12<i>天</i></b><span>连续记录</span></div>
      </div>
    </div>

    <!-- 容量趋势 -->
    <div class="sec"><h2>训练容量趋势 · 近 8 周</h2>
      <div class="card" style="padding:14px 16px 10px">
        <svg viewBox="0 0 326 86" style="width:100%;height:auto;color:var(--accent);display:block">
          <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="currentColor" stop-opacity=".26"/>
            <stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
          <path d="M0 65.7 L46.6 42.2 L93.1 70 L139.7 23 L186.3 8 L232.9 54 L279.4 34.7 L326 21.9 L326 78 L0 78 Z" fill="url(#ga)"/>
          <path d="M0 65.7 L46.6 42.2 L93.1 70 L139.7 23 L186.3 8 L232.9 54 L279.4 34.7 L326 21.9"
            fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="326" cy="21.9" r="4" fill="currentColor" stroke="var(--surface)" stroke-width="2.4"/>
        </svg>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:2px">
          <span>8周前</span><span>4周前</span><span>本周</span></div>
        <div style="display:flex;align-items:baseline;gap:6px;margin-top:10px;padding-top:11px;border-top:.5px solid var(--hairline)">
          <span class="num" style="font-size:16px;font-weight:600">+38%</span>
          <span style="font-size:12.5px;color:var(--t2)">较 8 周前（9.9k → 14.3k kg）</span>
        </div>
      </div>
    </div>

    <!-- 肌群分布 -->
    <div class="sec"><h2>肌群训练占比 · 近 30 天</h2>
      <div class="card" style="padding:14px 16px 6px">
        <div style="margin-bottom:12px">
          <div style="display:flex;font-size:13px;margin-bottom:6px"><span>胸</span>
            <span class="num" style="margin-left:auto;color:var(--t2)">32%</span></div>
          <div class="bar thin"><i style="width:32%"></i></div></div>
        <div style="margin-bottom:12px">
          <div style="display:flex;font-size:13px;margin-bottom:6px"><span>背</span>
            <span class="num" style="margin-left:auto;color:var(--t2)">28%</span></div>
          <div class="bar thin"><i style="width:28%;opacity:.72"></i></div></div>
        <div style="margin-bottom:12px">
          <div style="display:flex;font-size:13px;margin-bottom:6px"><span>腿</span>
            <span class="num" style="margin-left:auto;color:var(--t2)">24%</span></div>
          <div class="bar thin"><i style="width:24%;opacity:.48"></i></div></div>
        <div style="margin-bottom:12px">
          <div style="display:flex;font-size:13px;margin-bottom:6px"><span>肩 + 手臂</span>
            <span class="num" style="margin-left:auto;color:var(--t2)">16%</span></div>
          <div class="bar thin"><i style="width:16%;opacity:.30"></i></div></div>
      </div>
    </div>

    <!-- 设置 -->
    <div class="sec"><h2>数据与设置</h2>
      <div class="card">
        <div class="rows">
          <div class="row"><span class="ic"><svg><use href="#i-sun"/></svg></span>
            <span class="mid"><b>外观</b></span><span class="val">跟随系统</span><span class="chev"></span></div>
          <div class="row"><span class="ic"><svg><use href="#i-share"/></svg></span>
            <span class="mid"><b>导出数据</b><span>CSV / JSON 备份</span></span><span class="chev"></span></div>
          <div class="row"><span class="ic"><svg><use href="#i-chart"/></svg></span>
            <span class="mid"><b>关于 FitNote</b><span>v2.0.0 · 离线 · 开源</span></span><span class="chev"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>document.write(TABBAR('me'))</script>
</body></html>
