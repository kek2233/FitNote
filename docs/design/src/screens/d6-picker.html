<!DOCTYPE html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><title>06 选动作</title>
<link rel="stylesheet" href="../fitnote.css"></head><body>
<script src="../sprite.js"></script>
<script src="../chrome.js"></script>
<script>document.write(SB())</script>

<div class="nav">
  <span style="font-size:15px;color:var(--t2)">取消</span>
  <span style="margin:0 5rem 0 0;font-size:16px;font-weight:600">添加动作</span>
</div>

<div class="scroll">
  <div class="pad" style="padding-top:8px">
    <div style="display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;background:var(--surface-2);border-radius:11px;border:.5px solid var(--hairline)">
      <svg width="16" height="16" style="color:var(--t3)"><use href="#i-search"/></svg>
      <span style="font-size:15px;color:var(--t3)">搜索动作（中文 / 拼音）</span>
    </div>
  </div>

  <div style="margin-top:14px">
    <div class="chips">
      <span class="chip on">全部</span><span class="chip">胸</span><span class="chip">背</span>
      <span class="chip">腿</span><span class="chip">肩</span><span class="chip">手臂</span>
    </div>
  </div>

  <div class="pad">
    <div class="sec" style="margin-top:18px"><h2>最近使用</h2>
      <div class="card">
        <div class="rows">
          <div class="row"><span class="ic acc"><svg><use href="#i-dumbbell"/></svg></span>
            <span class="mid"><b>平板卧推</b><span>胸 · 杠铃</span></span>
            <span class="val num">62.5kg</span><span class="chev"></span></div>
          <div class="row"><span class="ic acc"><svg><use href="#i-dumbbell"/></svg></span>
            <span class="mid"><b>上斜哑铃卧推</b><span>胸 · 哑铃</span></span>
            <span class="val num">22kg</span><span class="chev"></span></div>
        </div>
      </div>
    </div>

    <div class="sec"><h2>胸部动作</h2>
      <div class="card">
        <div class="rows">
          <div class="row"><span class="ic"><svg><use href="#i-dumbbell"/></svg></span>
            <span class="mid"><b>平板卧推</b><span>杠铃 · 杠铃片</span></span>
            <span class="val num">62.5kg</span><span class="chev"></span></div>
          <div class="row"><span class="ic"><svg><use href="#i-dumbbell"/></svg></span>
            <span class="mid"><b>上斜卧推</b><span>杠铃 · 30° 上斜</span></span>
            <span class="val num">55kg</span><span class="chev"></span></div>
          <div class="row"><span class="ic"><svg><use href="#i-dumbbell"/></svg></span>
            <span class="mid"><b>哑铃飞鸟</b><span>哑铃 · 平板凳</span></span>
            <span class="val num">14kg</span><span class="chev"></span></div>
          <div class="row"><span class="ic"><svg><use href="#i-dumbbell"/></svg></span>
            <span class="mid"><b>绳索夹胸</b><span>龙门架</span></span>
            <span class="val num">20kg</span><span class="chev"></span></div>
          <div class="row"><span class="ic"><svg><use href="#i-dumbbell"/></svg></span>
            <span class="mid"><b>双杠臂屈伸</b><span>自重</span></span>
            <span class="val num">自重</span><span class="chev"></span></div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn ghost" style="height:44px;border-radius:13px;font-size:14.5px"><svg><use href="#i-plus"/></svg>新建自定义动作</button>
    </div>

    <p style="text-align:center;font-size:12.5px;color:var(--t3);margin:14px 0 0">器械被占用？长按动作可看「同类替代」</p>
  </div>
</div>
</body></html>
