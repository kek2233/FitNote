<!DOCTYPE html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><title>03 记录</title>
<link rel="stylesheet" href="../fitnote.css"></head><body>
<script src="../sprite.js"></script>
<script src="../chrome.js"></script>
<script>document.write(SB())</script>

<div class="nav">
  <span style="font-size:13px;color:var(--t2)">记录</span>
  <span class="ops"><span class="iconbtn"><svg><use href="#i-search"/></svg></span></span>
</div>

<div class="scroll">
  <div class="hero" style="padding-bottom:12px">
    <h1>记录</h1>
    <p>训练 · 饮食 · 身体数据，都在本机</p>
  </div>

  <div style="padding:0 0 4px">
    <div class="pad"><div class="seg">
      <button class="on">全部</button><button>训练</button><button>饮食</button><button>体脂</button>
    </div></div>
  </div>

  <div class="pad">
    <div class="sec" style="margin-top:16px"><h2>今天 · 10月14日</h2>
      <div class="card">
        <div class="rows">
          <div class="row">
            <span class="ic acc"><svg><use href="#i-dumbbell"/></svg></span>
            <span class="mid"><b>胸 + 三头</b><span>18 组 · 52 分钟 · 09:42–10:34</span></span>
            <span class="val num">4,820<i style="font-size:11px;font-style:normal;color:var(--t3);margin-left:1px">kg</i></span>
            <span class="chev"></span>
          </div>
          <div class="row">
            <span class="ic acc"><svg><use href="#i-flame"/></svg></span>
            <span class="mid"><b>饮食</b><span>3 餐 · 蛋白质 78g · 碳水 142g</span></span>
            <span class="val num">1,240<i style="font-size:11px;font-style:normal;color:var(--t3);margin-left:1px">kcal</i></span>
            <span class="chev"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="sec"><h2>昨天 · 10月13日</h2>
      <div class="card">
        <div class="rows">
          <div class="row">
            <span class="ic"><svg><use href="#i-dumbbell"/></svg></span>
            <span class="mid"><b>背 + 二头</b><span>16 组 · 48 分钟 · 18:05–18:53</span></span>
            <span class="val num">5,240<i style="font-size:11px;font-style:normal;color:var(--t3);margin-left:1px">kg</i></span>
            <span class="chev"></span>
          </div>
          <div class="row">
            <span class="ic"><svg><use href="#i-trend"/></svg></span>
            <span class="mid"><b>体脂率</b><span>围度法 · 腰围 82cm</span></span>
            <span class="val num">22.4%</span>
            <span class="chev"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="sec"><h2>10月12日</h2>
      <div class="card">
        <div class="rows">
          <div class="row">
            <span class="ic"><svg><use href="#i-dumbbell"/></svg></span>
            <span class="mid"><b>腿 + 核心</b><span>15 组 · 55 分钟</span></span>
            <span class="val num">6,180<i style="font-size:11px;font-style:normal;color:var(--t3);margin-left:1px">kg</i></span>
            <span class="chev"></span>
          </div>
        </div>
      </div>
    </div>

    <p style="text-align:center;font-size:12.5px;color:var(--t3);margin:18px 0 0">数据仅存本机 · 「我的」可导出 CSV 备份</p>
  </div>
</div>

<script>document.write(TABBAR('log'))</script>
</body></html>
