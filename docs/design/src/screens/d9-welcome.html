<!DOCTYPE html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><title>09 引导·欢迎</title>
<link rel="stylesheet" href="../fitnote.css"></head><body>
<script src="../sprite.js"></script>
<script src="../chrome.js"></script>
<script>document.write(SB())</script>

<div class="scroll" style="padding-bottom:0;display:flex;flex-direction:column">
  <div style="padding:14px 20px 0;display:flex;justify-content:flex-end">
    <span style="font-size:15px;color:var(--t2)">跳过</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px 8px">
    <div style="width:60px;height:60px;border-radius:18px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:22px">
      <svg width="30" height="30" style="color:var(--accent-ink)"><use href="#i-dumbbell"/></svg>
    </div>

    <h1 style="margin:0;font-size:34px;font-weight:800;letter-spacing:-.9px;line-height:1.12">FitNote</h1>
    <p style="margin:11px 0 0;font-size:16px;color:var(--t2);line-height:1.5">装在手机里的私人身体数据本<br>训练、体脂、饮食，一本记清</p>

    <div style="margin-top:32px;display:flex;flex-direction:column;gap:15px">
      <div style="display:flex;gap:11px;align-items:flex-start">
        <svg width="18" height="18" style="color:var(--accent);flex:none;margin-top:2px"><use href="#i-check"/></svg>
        <span style="font-size:14.5px;line-height:1.45">数据只存本机
          <span style="display:block;font-size:13px;color:var(--t2);margin-top:2px">没有账号，没有云端，不上传</span></span>
      </div>
      <div style="display:flex;gap:11px;align-items:flex-start">
        <svg width="18" height="18" style="color:var(--accent);flex:none;margin-top:2px"><use href="#i-check"/></svg>
        <span style="font-size:14.5px;line-height:1.45">识餐在本地完成
          <span style="display:block;font-size:13px;color:var(--t2);margin-top:2px">照片处理完即丢，不保留原图</span></span>
      </div>
      <div style="display:flex;gap:11px;align-items:flex-start">
        <svg width="18" height="18" style="color:var(--accent);flex:none;margin-top:2px"><use href="#i-check"/></svg>
        <span style="font-size:14.5px;line-height:1.45">没网也能用
          <span style="display:block;font-size:13px;color:var(--t2);margin-top:2px">健身房地下室、地铁里照样记</span></span>
      </div>
    </div>
  </div>

  </div>

  <div class="dock">
    <div class="dots" style="margin-bottom:18px"><i class="on"></i><i></i><i></i></div>
    <button class="btn" style="height:52px;border-radius:16px;font-size:16.5px">开始使用</button>
    <p style="text-align:center;font-size:12px;color:var(--t3);margin:11px 0 0">第 1 步 / 共 3 步</p>
  </div>
</body></html>
