<!DOCTYPE html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><title>01 今日</title>
<link rel="stylesheet" href="../fitnote.css"></head><body>
<script src="../sprite.js"></script>
<script src="../chrome.js"></script>
<script>document.write(SB())</script>

<div class="nav">
  <span style="font-size:13px;color:var(--t2)">10月14日 · 周三</span>
  <span class="ops"><span class="iconbtn"><svg><use href="#i-search"/></svg></span></span>
</div>

<div class="scroll">
  <div class="hero">
    <h1>今日</h1>
    <p>增肌期 · 第 3 周 · 每周 4 练</p>
  </div>

  <div class="pad">
    <!-- 今日训练主卡 -->
    <div class="card" style="padding:15px 16px 16px">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="chip on" style="height:26px;padding:0 11px;font-size:12px">推 · 胸 + 三头</span>
        <span style="margin-left:auto;font-size:12.5px;color:var(--t2)" class="num">3 个动作 · 约 45 分</span>
      </div>
      <div style="margin-top:12px">
        <div style="display:flex;align-items:center;padding:9px 0">
          <span class="num" style="width:20px;font-size:13px;color:var(--t3)">1</span>
          <span style="flex:1;font-size:15px">平板卧推</span>
          <span class="num" style="font-size:14px;color:var(--t2)">4 × 8 · 62.5kg</span>
        </div>
        <div style="display:flex;align-items:center;padding:9px 0;border-top:.5px solid var(--hairline)">
          <span class="num" style="width:20px;font-size:13px;color:var(--t3)">2</span>
          <span style="flex:1;font-size:15px">上斜哑铃卧推</span>
          <span class="num" style="font-size:14px;color:var(--t2)">3 × 10 · 22kg</span>
        </div>
        <div style="display:flex;align-items:center;padding:9px 0;border-top:.5px solid var(--hairline)">
          <span class="num" style="width:20px;font-size:13px;color:var(--t3)">3</span>
          <span style="flex:1;font-size:15px">绳索下压</span>
          <span class="num" style="font-size:14px;color:var(--t2)">3 × 12 · 25kg</span>
        </div>
      </div>
      <button class="btn" style="margin-top:14px"><svg><use href="#i-bolt"/></svg>开始训练</button>
    </div>

    <!-- 今日数据 -->
    <div class="sec"><h2>今日数据</h2>
      <div class="tiles">
        <div class="tile"><b class="num">1,240<i>kcal</i></b><span>今日已摄入</span></div>
        <div class="tile"><b class="num">—</b><span>训练容量</span></div>
        <div class="tile on"><b class="num">12<i>天</i></b><span>连续记录</span></div>
      </div>
    </div>

    <!-- 饮食 -->
    <div class="sec"><h2>饮食</h2>
      <div class="card">
        <div style="padding:14px 16px 12px">
          <div style="display:flex;align-items:baseline;gap:6px">
            <span class="num" style="font-size:23px;font-weight:700;letter-spacing:-.5px">1,240</span>
            <span style="font-size:13px;color:var(--t2)">/ 2,600 kcal</span>
            <span style="margin-left:auto;font-size:12.5px;color:var(--t2)">还差 1,360</span>
          </div>
          <div class="bar" style="margin-top:10px"><i style="width:48%"></i></div>
        </div>
        <div class="rows" style="padding:0 16px 4px">
          <div class="row"><span class="ic acc"><svg><use href="#i-check"/></svg></span>
            <span class="mid"><b>早餐</b><span>燕麦牛奶 · 280 kcal</span></span><span class="chev"></span></div>
          <div class="row"><span class="ic acc"><svg><use href="#i-check"/></svg></span>
            <span class="mid"><b>午餐</b><span>鸡胸糙米饭 · 620 kcal</span></span><span class="chev"></span></div>
          <div class="row"><span class="ic"><svg><use href="#i-camera"/></svg></span>
            <span class="mid"><b style="color:var(--t2)">晚餐</b><span>拍照识餐 / 选食物</span></span><span class="chev"></span></div>
        </div>
      </div>
    </div>

    <div class="sec"><h2>身体</h2>
      <div class="card">
        <div class="rows">
          <div class="row"><span class="ic"><svg><use href="#i-trend"/></svg></span>
            <span class="mid"><b>体脂率</b><span>上次 10月12日 · 围度法</span></span>
            <span class="val num">22.4%</span><span class="chev"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>document.write(TABBAR('today'))</script>
</body></html>
