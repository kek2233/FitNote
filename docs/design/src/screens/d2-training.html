<!DOCTYPE html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><title>02 训练进行中</title>
<link rel="stylesheet" href="../fitnote.css">
<style>
  .stepline{display:flex;align-items:center;gap:10px}
  .stepline>.lb{width:40px;font-size:13px;color:var(--t2);flex:none}
</style></head><body>
<script src="../sprite.js"></script>
<script src="../chrome.js"></script>
<script>document.write(SB())</script>

<div class="nav" style="background:transparent;border-bottom:0">
  <span style="flex:0 0 56px;font-size:15px;color:var(--t2)">结束</span>
  <span class="num" style="flex:1;text-align:center;font-size:15px;font-weight:600;letter-spacing:.2px">00:24:18</span>
  <span style="flex:0 0 56px;display:flex;justify-content:flex-end">
    <span class="iconbtn" style="background:transparent;border:0"><svg><use href="#i-more"/></svg></span></span>
</div>

<div class="scroll" style="padding-bottom:20px">
  <div class="hero" style="padding-top:2px">
    <h1>平板卧推</h1>
    <p>胸 · 杠铃 · 上次 62.5kg × 8</p>
  </div>

  <div class="pad">
    <!-- 本次已完成组 -->
    <div class="card" style="padding:6px 16px">
      <div style="display:flex;align-items:center;padding:10px 0">
        <span class="num" style="width:56px;font-size:13.5px;color:var(--t3)">第 1 组</span>
        <span class="num" style="flex:1;font-size:16px;font-weight:500">60 kg × 8</span>
        <svg width="17" height="17" style="color:var(--accent)"><use href="#i-check"/></svg>
      </div>
      <div style="display:flex;align-items:center;padding:10px 0;border-top:.5px solid var(--hairline)">
        <span class="num" style="width:56px;font-size:13.5px;color:var(--t3)">第 2 组</span>
        <span class="num" style="flex:1;font-size:16px;font-weight:500">62.5 kg × 8</span>
        <svg width="17" height="17" style="color:var(--accent)"><use href="#i-check"/></svg>
      </div>
      <div style="display:flex;align-items:center;padding:11px 12px;margin:0 -8px 8px;background:var(--accent-soft);border-radius:12px">
        <span class="num" style="width:56px;font-size:13.5px;color:var(--accent);font-weight:600">第 3 组</span>
        <span style="flex:1;font-size:14px;color:var(--t2)">进行中…</span>
      </div>
    </div>

    <!-- 记组控件 -->
    <div class="sec" style="margin-top:20px">
      <div class="stepline" style="margin-bottom:10px">
        <span class="lb">重量</span>
        <span class="stepper" style="flex:1"><button>−</button><span class="v num">62.5<u>kg</u></span><button>+</button></span>
      </div>
      <div class="stepline">
        <span class="lb">次数</span>
        <span class="stepper" style="flex:1"><button>−</button><span class="v num">8<u>次</u></span><button>+</button></span>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;padding-left:50px">
        <span class="chip" style="height:28px;font-size:12px;padding:0 11px">沿用上一组</span>
        <span class="chip" style="height:28px;font-size:12px;padding:0 11px">热身组</span>
        <span class="chip" style="height:28px;font-size:12px;padding:0 11px">力竭</span>
      </div>
    </div>

    <!-- 组间休息 -->
    <div class="card" style="margin-top:16px;padding:12px 14px;display:flex;align-items:center;gap:12px">
      <span style="width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none">
        <svg width="18" height="18" style="color:var(--accent)"><use href="#i-timer"/></svg></span>
      <span style="flex:1;min-width:0">
        <b style="display:block;font-size:14px;font-weight:500">组间休息 · 90 秒</b>
        <span class="bar thin" style="display:block;margin-top:8px"><i style="width:62%"></i></span>
      </span>
      <span class="num" style="font-size:21px;font-weight:700;letter-spacing:-.4px">0:34</span>
    </div>

    <!-- 主按钮 -->
    <button class="btn" style="margin-top:16px;height:54px;border-radius:16px;font-size:17px">
      <svg><use href="#i-check"/></svg>完成本组</button>

    <!-- 快捷操作 -->
    <div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn ghost" style="height:44px;border-radius:13px;font-size:14.5px"><svg><use href="#i-plus"/></svg>添加动作</button>
      <button class="btn ghost" style="height:44px;border-radius:13px;font-size:14.5px">切换动作</button>
    </div>

    <p style="text-align:center;font-size:12.5px;color:var(--t3);margin:14px 0 0">
      器械被占用？点「切换动作」推荐同类替代（同肌群）</p>

    <div class="sec" style="margin-top:20px"><h2>本场接下来</h2>
      <div class="card">
        <div class="rows">
          <div class="row"><span class="ic"><svg><use href="#i-dumbbell"/></svg></span>
            <span class="mid"><b>上斜哑铃卧推</b><span>3 × 10 · 上次 22kg</span></span><span class="chev"></span></div>
          <div class="row"><span class="ic"><svg><use href="#i-dumbbell"/></svg></span>
            <span class="mid"><b>绳索下压</b><span>3 × 12 · 上次 25kg</span></span><span class="chev"></span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
