<!DOCTYPE html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><title>12 食物库</title>
<link rel="stylesheet" href="../fitnote.css"></head><body>
<script src="../sprite.js"></script>
<script src="../chrome.js"></script>
<script>document.write(SB())</script>

<div class="nav">
  <span style="font-size:15px;color:var(--t2)">返回</span>
  <span class="ops"><span class="iconbtn" style="background:transparent;border:0"><svg><use href="#i-plus"/></svg></span></span>
</div>

<div class="scroll">
  <div class="hero" style="padding-top:4px;padding-bottom:14px">
    <h1>食物库</h1>
    <p>1,677 种 · 数据来自《中国食物成分表》第 6 版</p>
  </div>

  <div class="pad">
    <div style="display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;background:var(--surface-2);border-radius:11px;border:.5px solid var(--hairline)">
      <svg width="16" height="16" style="color:var(--t3)"><use href="#i-search"/></svg>
      <span style="font-size:15px;color:var(--t3)">搜索食物（中文 / 拼音）</span>
    </div>
  </div>

  <div style="margin-top:14px">
    <div class="chips">
      <span class="chip on">全部</span><span class="chip">主食</span><span class="chip">肉蛋</span>
      <span class="chip">蔬菜</span><span class="chip">水果</span><span class="chip">豆奶</span>
    </div>
  </div>

  <div class="pad">
    <div class="sec" style="margin-top:16px"><h2>最近常用</h2>
      <div class="card">
        <div class="rows">
          <div class="row"><span class="ic acc"><svg><use href="#i-utensils"/></svg></span>
            <span class="mid"><b>白米饭</b><span>主食 · 默认 150g</span></span>
            <span class="val num">174</span><span class="chev"></span></div>
          <div class="row"><span class="ic acc"><svg><use href="#i-utensils"/></svg></span>
            <span class="mid"><b>鸡胸肉</b><span>肉蛋 · 默认 150g</span></span>
            <span class="val num">210</span><span class="chev"></span></div>
        </div>
      </div>
    </div>

    <div class="sec"><h2>主食类 · 含米饭面点</h2>
      <div class="card">
        <div class="rows">
          <div class="row"><span class="ic"><svg><use href="#i-utensils"/></svg></span>
            <span class="mid"><b>包子（猪肉馅）</b><span>主食 · 默认 100g</span></span>
            <span class="val num">227</span><span class="chev"></span></div>
          <div class="row"><span class="ic"><svg><use href="#i-utensils"/></svg></span>
            <span class="mid"><b>花卷</b><span>主食 · 默认 100g</span></span>
            <span class="val num">217</span><span class="chev"></span></div>
          <div class="row"><span class="ic"><svg><use href="#i-utensils"/></svg></span>
            <span class="mid"><b>油条</b><span>主食 · 默认 60g</span></span>
            <span class="val num">232</span><span class="chev"></span></div>
          <div class="row"><span class="ic"><svg><use href="#i-utensils"/></svg></span>
            <span class="mid"><b>兰州拉面（熟）</b><span>主食 · 默认 250g</span></span>
            <span class="val num">345</span><span class="chev"></span></div>
          <div class="row"><span class="ic"><svg><use href="#i-utensils"/></svg></span>
            <span class="mid"><b>扬州炒饭</b><span>主食 · 默认 200g</span></span>
            <span class="val num">386</span><span class="chev"></span></div>
          <div class="row"><span class="ic"><svg><use href="#i-utensils"/></svg></span>
            <span class="mid"><b>煎饼果子</b><span>主食 · 默认 180g</span></span>
            <span class="val num">432</span><span class="chev"></span></div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn ghost" style="height:44px;border-radius:13px;font-size:14.5px"><svg><use href="#i-plus"/></svg>自定义食物</button>
    </div>

    <p style="text-align:center;font-size:12.5px;color:var(--t3);margin:14px 0 0">全部数据随包内置 · 离线可查 · 无网络请求</p>
  </div>
</div>
</body></html>
