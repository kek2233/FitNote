<!DOCTYPE html><html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><title>10 引导·选计划</title>
<link rel="stylesheet" href="../fitnote.css">
<style>
  .plan{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border-radius:var(--r-in);
    background:var(--surface);border:.5px solid var(--hairline);margin-top:10px}
  .plan.on{border-color:var(--accent);background:var(--accent-soft)}
  .plan .rd{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--t3);flex:none;margin-top:1px;
    display:flex;align-items:center;justify-content:center}
  .plan.on .rd{border-color:var(--accent);background:var(--accent)}
  .plan.on .rd svg{width:12px;height:12px;color:var(--accent-ink)}
  .plan b{display:block;font-size:16px;font-weight:600;letter-spacing:-.2px}
  .plan em{display:block;font-style:normal;font-size:13px;color:var(--t2);margin-top:3px;line-height:1.45}
  .plan i{display:inline-block;font-style:normal;font-size:11.5px;color:var(--t2);margin-top:7px;
    padding:2px 8px;border-radius:99px;background:var(--surface-2)}
  .plan.on i{background:rgba(62,209,127,.16);color:var(--accent)}
</style></head><body>
<script src="../sprite.js"></script>
<script src="../chrome.js"></script>
<script>document.write(SB())</script>

<div class="scroll" style="padding-bottom:0;display:flex;flex-direction:column">
  <div style="padding:14px 20px 0;display:flex;justify-content:space-between;align-items:center">
    <span style="font-size:15px;color:var(--t2)">返回</span>
    <span style="font-size:15px;color:var(--t2)">跳过</span>
  </div>

  <div class="hero" style="padding-top:26px">
    <h1>选一个起点</h1>
    <p>按你的训练经验推荐，之后随时能改</p>
  </div>

  <div class="pad" style="padding:0 20px">
    <div class="plan">
      <span class="rd"></span>
      <span style="flex:1">
        <b>轻松入门</b>
        <em>每周 3 练，每次 30 分钟，动作以器械和固定轨迹为主</em>
        <i>新手 · 每周 3 练</i>
      </span>
    </div>

    <div class="plan on">
      <span class="rd"><svg><use href="#i-check"/></svg></span>
      <span style="flex:1">
        <b>均衡进阶</b>
        <em>每周 4 练，推 / 拉 / 腿分化，覆盖全部大肌群</em>
        <i>有 6 个月以上经验 · 每周 4 练</i>
      </span>
    </div>

    <div class="plan">
      <span class="rd"></span>
      <span style="flex:1">
        <b>高效强化</b>
        <em>每周 5 练，高容量 + 强度周期，含 PR 冲击组</em>
        <i>1 年以上系统训练 · 每周 5 练</i>
      </span>
    </div>
  </div>

  </div>

  <div class="dock">
    <div class="dots" style="margin-bottom:18px"><i></i><i></i><i class="on"></i></div>
    <button class="btn" style="height:52px;border-radius:16px;font-size:16.5px">开始我的训练计划</button>
    <p style="text-align:center;font-size:12px;color:var(--t3);margin:11px 0 0">第 3 步 / 共 3 步</p>
  </div>
</body></html>
