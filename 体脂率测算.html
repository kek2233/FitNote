<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#070b09" />
<title>体脂率测算</title>
<style>
  /* =====================================================================
     深色液态玻璃主题（Glassmorphism）
     ===================================================================== */
  :root{
    --brand:#34d399; --brand-d:#22c55e; --brand-l:rgba(52,211,153,.16); --brand-bg:rgba(52,211,153,.10);
    --text:#f2f7fb; --text-dim:#b3c0cc; --text-mute:#7d8b96;
    --bg:#0a0f0e; --card:rgba(255,255,255,.055); --line:rgba(255,255,255,.10); --line-d:rgba(255,255,255,.18);
    --great:#34d399; --ok:#60a5fa; --warn:#fbbf24; --bad:#f87171;
    --radius:24px;
    /* iOS 26 玻璃：更亮的填充 + 顶边高光 + 底边内阴影，让"厚度感"出来 */
    --glass:linear-gradient(150deg,rgba(255,255,255,.17),rgba(255,255,255,.07) 44%,rgba(255,255,255,.035));
    --glass-bd:1px solid rgba(255,255,255,.17);
    --glass-rim:inset 0 1px 0 rgba(255,255,255,.42), inset 0 -1px 0 rgba(0,0,0,.22), inset 0 0 44px rgba(255,255,255,.05);
    --shadow:0 16px 44px rgba(2,6,12,.46), 0 3px 10px rgba(0,0,0,.28), var(--glass-rim);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:#06080f;color:var(--text);font-family:'HarmonyOS Sans SC','MiSans','PingFang SC','HONOR Sans CN','OPPO Sans','SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Microsoft YaHei',sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  /* iOS 26 壁纸：高饱和彩色光斑（玻璃卡片要靠它才有"折射/模糊"可看） */
  .app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(158px + var(--safe-b));
    background:
      radial-gradient(115% 62% at 10% -8%,rgba(56,189,248,.52),transparent 58%),
      radial-gradient(100% 56% at 94% 2%,rgba(52,211,153,.46),transparent 56%),
      radial-gradient(92% 52% at 82% 86%,rgba(167,139,250,.42),transparent 58%),
      radial-gradient(86% 50% at 4% 92%,rgba(244,114,182,.34),transparent 58%),
      radial-gradient(70% 44% at 50% 48%,rgba(45,212,191,.16),transparent 60%),
      linear-gradient(178deg,#0b1526 0%,#081214 52%,#0b0a17 100%);
    background-attachment:fixed}

  /* ---------- 顶部栏（iOS 26 玻璃） ---------- */
  .hd{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(14,20,30,.42),rgba(10,16,24,.62));backdrop-filter:blur(30px) saturate(200%);-webkit-backdrop-filter:blur(30px) saturate(200%);box-shadow:0 10px 30px rgba(0,0,0,.26);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
  .hd-t{font-size:17px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center}
  .hd-t::before{content:'';width:11px;height:11px;border-radius:3.5px;background:linear-gradient(135deg,#6ee7b7,#22c55e);margin-right:8px;flex:none;box-shadow:0 0 12px rgba(52,211,153,.6)}
  .hd-s{font-size:12px;color:var(--text-dim);margin-top:1px}
  .hd-b{border:1px solid rgba(255,255,255,.20);background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.06));color:var(--text);font-size:12px;padding:6px 13px;border-radius:999px;cursor:pointer;font-family:inherit;backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);box-shadow:0 4px 16px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.42);transition:transform .16s cubic-bezier(.32,.72,0,1)}
  .hd-b:active{transform:scale(.94)}

  /* ---------- iOS 大标题（干净 SF Pro 风格） ---------- */
  .ph{padding:8px 4px 4px;margin-bottom:14px}
  .art{font-size:31px;font-weight:800;letter-spacing:-.6px;line-height:1.18;color:#fff}
  .art-sm{font-size:19px;font-weight:700;letter-spacing:-.2px;color:#fff}
  .ph-s{font-size:13.5px;color:var(--text-dim);margin-top:5px;letter-spacing:.1px}

  .body{padding:14px 14px 20px}
  .card{background:var(--glass);backdrop-filter:blur(28px) saturate(190%) brightness(1.05);-webkit-backdrop-filter:blur(28px) saturate(190%) brightness(1.05);border:var(--glass-bd);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:13px}
  .card-t{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
  .card-t .sub{font-size:12px;font-weight:400;color:var(--text-dim)}
  .card-t .link{font-size:12px;font-weight:600;color:var(--brand);cursor:pointer}

  /* ---------- 玻璃提示卡 ---------- */
  .hint{text-align:center;color:var(--text-dim);font-size:13.5px;padding:26px 16px;
    background:linear-gradient(160deg,rgba(52,211,153,.09),rgba(255,255,255,.03))}

  /* ---------- Hero（结果页） ---------- */
  .hero{background:linear-gradient(160deg,rgba(52,211,153,.18),rgba(52,211,153,.05));border:1px solid rgba(52,211,153,.28);border-radius:var(--radius);padding:18px;margin-bottom:13px;box-shadow:0 12px 40px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.12)}
  .hero-flex{display:flex;align-items:center;gap:16px}
  .hero-ring{width:98px;height:98px;border-radius:50%;flex:none;background:conic-gradient(#4ade80 calc(var(--pct)*1%),rgba(255,255,255,.13) 0);display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(74,222,128,.22)}
  .hero-ring-in{width:78px;height:78px;border-radius:50%;background:rgba(4,26,19,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
  .hero-ring-in b{font-size:26px;font-weight:800;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
  .hero-ring-in small{font-size:11px;opacity:.9;margin-top:2px}
  .hero-info{flex:1;min-width:0}
  .hero-lab{font-size:13px;margin-top:0}
  .hero-sub{font-size:12px;opacity:.85;margin-top:9px;line-height:1.5;color:var(--text-dim)}
  .hero-num{font-size:46px;font-weight:800;line-height:1.05;letter-spacing:-1px;font-variant-numeric:tabular-nums}

  /* ---------- 行式表单 ---------- */
  .row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row-l{font-size:15px}
  .row-r{display:flex;align-items:center;gap:7px}
  .row-r .unit{font-size:14px;color:var(--text-mute)}
  .row-r .inp{width:82px;background:transparent;border:0;border-bottom:1.5px solid var(--line-d);border-radius:0;text-align:right;font-size:17px;font-weight:600;padding:4px 2px}
  .row-r .inp:focus{border-bottom-color:var(--brand);box-shadow:none;background:transparent}

  .fld{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
  .fld:last-child{border-bottom:0}
  .fld-l{font-size:14px}
  .fld-l .u{color:var(--text-mute);font-size:12px;margin-left:3px}
  .inp{width:104px;text-align:right;font-size:15px;font-weight:600;font-family:inherit;border:1px solid var(--line-d);background:rgba(255,255,255,.05);border-radius:11px;padding:8px 10px;outline:none;transition:border-color .15s,box-shadow .15s;color:var(--text)}
  .inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(52,211,153,.16)}
  .seg{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px;gap:2px;box-shadow:inset 0 1px 3px rgba(0,0,0,.32)}
  .seg button{border:0;background:transparent;font-family:inherit;font-size:13px;color:var(--text-dim);padding:7px 17px;border-radius:999px;cursor:pointer;transition:.15s}
  .seg button.on{background:rgba(255,255,255,.92);color:#0b0f0e;font-weight:600;box-shadow:0 1px 5px rgba(0,0,0,.35), inset 0 -1px 0 rgba(0,0,0,.06)}

  /* ---------- 按钮 ---------- */
  .btn{display:block;width:100%;border:0;border-radius:999px;padding:15px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#4ade80,#22c55e);color:#04281a;transition:.15s;box-shadow:0 8px 24px rgba(74,222,128,.28)}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:rgba(255,255,255,.06);color:var(--brand);border:1px solid rgba(52,211,153,.4);box-shadow:none}
  .btn.gray{background:rgba(255,255,255,.07);color:var(--text-dim);box-shadow:none}
  .btn.sm{display:inline-block;width:auto;padding:8px 15px;font-size:13px;border-radius:999px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row-btns{display:flex;gap:9px;margin-top:10px}
  .row-btns .btn{margin:0}

  /* ---------- 统计小块 ---------- */
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .st{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px;padding:11px 8px;text-align:center}
  .st-n{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .st-l{font-size:11px;color:var(--text-dim);margin-top:3px}
  .lv{display:inline-block;font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px}
  .bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#34d399,#4ade80);transition:width .4s}

  /* ---------- 记录 ---------- */
  .rec{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);transition:background .12s}
  .rec:last-child{border-bottom:0}
  .rec-d{font-size:12px;color:var(--text-dim);width:52px;flex:none}
  .rec-b{flex:1;min-width:0}
  .rec-n{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  .rec-m{font-size:11px;color:var(--text-mute);margin-top:1px}
  .rec-x{border:0;background:transparent;color:var(--text-mute);font-size:18px;cursor:pointer;padding:4px 6px;font-family:inherit}
  .empty{text-align:center;padding:36px 16px;color:var(--text-mute);font-size:13px;line-height:1.8}

  /* ---------- 计划 ---------- */
  .goals{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .goal{border:1px solid var(--line-d);border-radius:14px;padding:13px 8px;text-align:center;cursor:pointer;background:rgba(255,255,255,.04);transition:.15s}
  .goal.on{border-color:rgba(52,211,153,.6);background:var(--brand-bg);box-shadow:0 0 18px rgba(52,211,153,.12)}
  .goal-i{font-size:22px}
  .goal-t{font-size:13px;font-weight:600;margin-top:4px}
  .goal-s{font-size:11px;color:var(--text-dim);margin-top:2px}
  .macro{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;text-align:center}
  .macro-n{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .macro-l{font-size:11px;color:var(--text-dim);margin-top:2px}
  .stack{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:10px 0 6px;background:rgba(255,255,255,.08)}
  .stack i{display:block;height:100%}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--text-dim);flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .meal{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .meal:last-child{border-bottom:0}
  .meal-k{font-size:12px;font-weight:600;color:var(--brand);width:38px;flex:none;padding-top:1px}
  .meal-v{font-size:13px;flex:1}
  .meal-c{font-size:12px;color:var(--text-dim);flex:none}
  .alert{display:flex;gap:9px;padding:11px 13px;border-radius:13px;background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.30);color:#fcd34d;font-size:12.5px;line-height:1.6;margin-bottom:12px}
  .alert a{color:#fcd34d}

  /* ---------- 签到 ---------- */
  .ck-row{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .ck-row:last-child{border-bottom:0}
  .ck{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--line-d);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:transparent;transition:.15s}
  .ck.on{background:var(--brand);border-color:var(--brand);color:#052e1f;animation:pop .22s ease}
  @keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
  .ckr-b{flex:1;min-width:0}
  .ckr-t{font-size:14px;font-weight:600}
  .ckr-d{font-size:12px;color:var(--text-dim);margin-top:2px;line-height:1.6}
  .ck-row.done .ckr-t{color:var(--text-mute);text-decoration:line-through}
  .ck-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;flex:none;margin-top:1px}
  .done-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#34d399,#16a34a);color:#04281a;border:0;border-radius:var(--radius);padding:16px;text-align:center;margin-bottom:12px;box-shadow:0 10px 30px rgba(52,211,153,.28)}
  .done-hero .t{font-size:16px;font-weight:800}
  .done-hero .s{font-size:12px;opacity:.85;margin-top:4px}
  .done-hero::after{content:'🎉';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:34px;opacity:.3}
  .streak{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim)}
  .streak b{color:var(--brand)}

  /* ---------- 热量 ---------- */
  .ring{display:flex;align-items:center;gap:16px}
  .ring-n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
  .ring-l{font-size:12px;color:var(--text-dim)}
  .cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
  .cat{flex:none;font-size:12px;padding:6px 13px;border-radius:999px;border:1px solid var(--line-d);background:rgba(255,255,255,.05);color:var(--text-dim);cursor:pointer;font-family:inherit;transition:.15s}
  .cat.on{background:var(--brand);border-color:var(--brand);color:#052e1f;font-weight:700}
  .srch{width:100%;border:1px solid var(--line-d);border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit;background:rgba(255,255,255,.05);outline:none;margin-bottom:10px;color:var(--text)}
  .srch:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(52,211,153,.14)}
  .fd{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .fd:last-child{border-bottom:0}
  .fd-n{flex:1;font-size:14px;min-width:0}
  .fd-u{font-size:11px;color:var(--text-mute);font-variant-numeric:tabular-nums}
  .fd-k{font-size:13px;font-weight:600;color:var(--brand);flex:none;font-variant-numeric:tabular-nums}
  .addfood{border:1px dashed rgba(52,211,153,.5);color:var(--brand);border-radius:12px;padding:11px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px}
  .photo{border:1px dashed rgba(255,255,255,.18);border-radius:16px;padding:15px;text-align:center;font-size:13.5px;color:var(--text-dim);background:rgba(255,255,255,.035);cursor:pointer;margin-bottom:13px;transition:.15s}
  .photo:active{transform:scale(.985)}
  .photo .big{font-size:30px;display:block;margin-bottom:6px}
  .photo img{max-width:100%;border-radius:12px;margin-top:8px;display:block;max-height:220px;margin-left:auto;margin-right:auto}
  .log{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);transition:background .12s}
  .log:last-child{border-bottom:0}
  .log-b{flex:1;min-width:0}
  .log-n{font-size:13.5px}
  .log-m{font-size:11px;color:var(--text-mute);margin-top:1px}
  .log-k{font-size:13px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}
  .log-x{border:0;background:transparent;color:var(--text-mute);font-size:17px;cursor:pointer;padding:2px 4px;font-family:inherit}
  .mst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
  .mst .m{background:rgba(255,255,255,.045);border:1px solid var(--line-d);border-radius:13px;padding:9px 6px;text-align:center;transition:transform .12s}
  .mst .m:active{transform:scale(.96)}
  .mst .m .t{font-size:12px;font-weight:600}
  .mst .m .s{font-size:10.5px;margin-top:3px;color:var(--text-dim)}
  .mst .m.eaten{border-color:rgba(52,211,153,.55);background:var(--brand-bg)}
  .mst .m.eaten .s{color:var(--brand);font-weight:600}
  .mst .m.missed{border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.08)}
  .mst .m.missed .s{color:var(--bad);font-weight:600}
  .mst .m.open .s{color:var(--ok);font-weight:600}

  /* ---------- 底部标签：iOS 26 悬浮玻璃胶囊 ---------- */
  .tabs{position:fixed;bottom:calc(12px + var(--safe-b));left:12px;right:12px;z-index:30;
    background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07));
    backdrop-filter:blur(34px) saturate(210%);-webkit-backdrop-filter:blur(34px) saturate(210%);
    border:1px solid rgba(255,255,255,.19);border-radius:28px;
    box-shadow:0 20px 54px rgba(2,6,14,.58), 0 4px 14px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(0,0,0,.24);
    display:flex;padding:7px 7px;max-width:496px;margin:0 auto;overflow:hidden}
  .tabs::before{content:'';position:absolute;left:8%;right:8%;top:0;height:1px;border-radius:999px;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.72),transparent)}
  .tab{flex:1;border:0;background:transparent;font-family:inherit;padding:9px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-dim);position:relative;transition:transform .18s cubic-bezier(.32,.72,0,1)}
  .tab .i{font-size:19px;line-height:1;transition:transform .22s cubic-bezier(.34,1.4,.4,1);position:relative;z-index:1}
  .tab .t{font-size:10.5px;position:relative;z-index:1;letter-spacing:.2px}
  .tab.on{color:#fff}
  .tab.on .t{font-weight:700}
  .tab.on .i{transform:translateY(-2px) scale(1.16)}
  .tab.on::after{content:'';position:absolute;top:4px;bottom:6px;left:50%;transform:translateX(-50%);width:52px;border-radius:18px;
    background:linear-gradient(180deg,rgba(52,211,153,.34),rgba(52,211,153,.14));
    border:1px solid rgba(255,255,255,.24);
    box-shadow:0 6px 20px rgba(52,211,153,.30), inset 0 1px 0 rgba(255,255,255,.45);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .tab:active{transform:scale(.94)}

  /* ---------- 弹层（玻璃） ---------- */
  .mask{position:fixed;inset:0;background:rgba(2,8,6,.6);z-index:40;opacity:0;pointer-events:none;transition:.2s}
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:linear-gradient(180deg,rgba(30,40,54,.72),rgba(16,24,34,.88));backdrop-filter:blur(36px) saturate(200%);-webkit-backdrop-filter:blur(36px) saturate(200%);border:1px solid rgba(255,255,255,.16);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -18px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.38);transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-width:520px;margin:0 auto;padding:8px 16px calc(20px + var(--safe-b));max-height:88vh;overflow-y:auto}
  .sheet.on{transform:translateY(0)}
  .sh-h{width:36px;height:4px;border-radius:999px;background:rgba(255,255,255,.18);margin:4px auto 12px}
  .sh-t{font-size:15px;font-weight:700;margin-bottom:10px}
  .qk{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .qk button{border:1px solid var(--line-d);background:rgba(255,255,255,.05);font-family:inherit;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--text-dim)}
  .qk button.on{background:var(--brand);border-color:var(--brand);color:#052e1f;font-weight:700}
  .flds{margin-top:4px}
  .mini{font-size:11.5px;color:var(--text-mute);line-height:1.7}
  .toast{position:fixed;left:50%;bottom:132px;transform:translate(-50%,12px);z-index:60;background:linear-gradient(160deg,rgba(255,255,255,.94),rgba(236,253,245,.88));color:#052e1f;font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.24s cubic-bezier(.32,.72,0,1);max-width:82%;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- 交互反馈 ---------- */
  .card{transition:transform .12s ease}
  @media (hover:hover){ .card:active{filter:brightness(1.06)} }
  .fd:active,.rec:active,.ck-row:active,.log:active{background:rgba(255,255,255,.04)}
  .goal{transition:transform .12s}
  .goal:active{transform:scale(.96)}
  .hero-num,.ring-n,.macro-n,.st-n,.rec-n,.fd-k,.log-k{font-variant-numeric:tabular-nums}

  /* ---------- iOS 26 液态玻璃：多层折射 + 顶边高光 + 跟手光斑 ---------- */
  .card{position:relative;overflow:hidden;
    background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.045) 34%,transparent 58%),
               linear-gradient(150deg,rgba(255,255,255,.115),rgba(255,255,255,.05) 46%,rgba(255,255,255,.028));
    border:1px solid rgba(255,255,255,.16);
    /* ① 顶边高光 ② 菲涅尔内光环（6px，四周） ③ 底边内阴影 ④ 外投影 —— 出"玻璃厚度" */
    box-shadow:0 16px 44px rgba(2,6,12,.46), 0 3px 10px rgba(0,0,0,.26),
      inset 0 1px 0 rgba(255,255,255,.42),
      inset 0 0 0 6px rgba(255,255,255,.055),
      inset 0 -1px 0 rgba(255,255,255,.10),
      inset 0 0 46px rgba(255,255,255,.05)}
  /* 跟手的镜面高光：--gx/--gy/--gl 由 JS 实时写入，光斑随手指"流"过去 */
  .card::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(260px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.26),rgba(255,255,255,.06) 42%,transparent 68%);
    opacity:var(--gl,0);transition:opacity .25s ease}
  /* 最外缘 ≤2px 的低强度彩虹色差（只贴边、不铺面）——参考开源液态玻璃实现 */
  .card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
    padding:2px;
    background:conic-gradient(from 0deg,
      rgba(255,0,90,.20) 0deg,rgba(255,200,0,.20) 60deg,rgba(0,255,170,.20) 130deg,
      rgba(0,140,255,.20) 200deg,rgba(170,0,255,.20) 280deg,rgba(255,0,90,.20) 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;
    mix-blend-mode:screen;opacity:.8}
  /* 按下时：模糊略减、高光增强（交互态才做缓动，避免进场时模糊"涨上来"的闪动） */
  .card:active{backdrop-filter:blur(20px) saturate(210%) brightness(1.08);-webkit-backdrop-filter:blur(20px) saturate(210%) brightness(1.08)}
  .hint{background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.01) 40%,transparent 60%),
              linear-gradient(160deg,rgba(52,211,153,.10),rgba(255,255,255,.03))}
  .btn{position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(74,222,128,.34),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.14);transition:transform .16s cubic-bezier(.32,.72,0,1),box-shadow .16s}
  .btn:active{transform:scale(.955)}
  .btn::after{content:'';position:absolute;left:12%;right:12%;top:2px;height:34%;border-radius:999px;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
  .mini-btn{transition:transform .16s cubic-bezier(.32,.72,0,1)}
  .mini-btn:active{transform:scale(.93)}
  .hero{position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(118deg,transparent 34%,rgba(255,255,255,.09) 48%,transparent 62%)}
  .goal{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .goal.on{background:linear-gradient(160deg,rgba(52,211,153,.20),rgba(52,211,153,.08));box-shadow:0 0 22px rgba(52,211,153,.16),inset 0 1px 0 rgba(255,255,255,.18)}
  .mst .m{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .st{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
  .seg button.on{box-shadow:0 1px 5px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.6)}
  .inp,.srch{background:rgba(255,255,255,.045);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .tabs{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .sheet{box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
  .photo{background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015))}
  .done-hero::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 45%)}

  /* ---------- 悬浮液态玻璃 Dock（iOS 26 风格） ---------- */
  .tabs{position:fixed;bottom:calc(16px + var(--safe-b));left:14px;right:14px;max-width:492px;margin:0 auto;
    background:rgba(22,30,28,.72);backdrop-filter:blur(32px) saturate(185%);-webkit-backdrop-filter:blur(32px) saturate(185%);
    border:1px solid rgba(255,255,255,.13);border-radius:40px;
    box-shadow:0 22px 52px rgba(0,0,0,.58), 0 2px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(0,0,0,.28);
    display:flex;padding:9px 12px;z-index:30}
  .tab{flex:1;border:0;background:transparent;font-family:inherit;padding:5px 0 3px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-mute);position:relative;border-radius:26px;transition:color .18s}
  .tab .t{font-size:11px;letter-spacing:.4px;position:relative;z-index:1}
  .tab.on{color:var(--brand)}
  .tab.on .t{font-weight:700}
  .tab:not(.on):active .gi{transform:scale(.9)}
  /* iOS 彩色圆角图标（squircle，内联提供渐变背景） */
  .gi{width:47px;height:47px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none;
    background:linear-gradient(160deg,#3a3f4b,#262b33);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 3px 12px rgba(0,0,0,.35);
    transition:transform .18s ease, filter .18s ease, box-shadow .18s ease;position:relative;z-index:1}
  .gi svg{width:23px;height:23px;color:#fff;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
  .gi.sm{width:40px;height:40px;border-radius:13px}
  .gi.sm svg{width:20px;height:20px}
  .gi.lg{width:62px;height:62px;border-radius:20px;margin:0 auto 8px}
  .gi.lg svg{width:30px;height:30px}
  .tab:not(.on) .gi{filter:saturate(.55) brightness(.72)}
  .tab.on .gi{box-shadow:inset 0 1px 0 rgba(255,255,255,.30), 0 6px 18px rgba(0,0,0,.42), 0 0 24px rgba(255,255,255,.14);transform:translateY(-2px)}
  .tab.on .gi svg{color:#fff}

  /* ---------- 矢量图标 ---------- */
  .ic{display:inline-block;vertical-align:-3px;flex:none}
  .eic{display:flex;justify-content:center;margin-bottom:10px;opacity:.65}
  .eic svg{width:34px;height:34px}
  .ck .ic{vertical-align:0}

  /* ---------- 液态玻璃滑动动效 ---------- */
  /* 卡片高光 + 3D 倾斜跟随手部（位置由 JS 阻尼插值驱动，非跳变） */
  .card{--gx:50%;--gy:50%;--rx:0deg;--ry:0deg;--gl:0;
    transform:perspective(1100px) rotateX(var(--rx)) rotateY(var(--ry));will-change:transform}
  .card::before{background:
      radial-gradient(150px circle at var(--gx) var(--gy),rgba(255,255,255,.14),transparent 62%),
      radial-gradient(330px circle at var(--gx) var(--gy),rgba(255,255,255,.055),transparent 72%);
    opacity:var(--gl);transition:opacity .55s ease}
  /* 页面入场动画 */
  .ph,.hero,.mst{animation:rise .3s ease}
  .card{animation:rise .34s ease}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  /* 底栏与 hero 的周期性扫光（液态滑动感） */
  .tabs::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
    background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.10) 46%,transparent 60%);
    background-size:250% 100%;background-repeat:no-repeat;animation:shine 5s ease-in-out infinite}
  .hero::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.12) 46%,transparent 60%);
    background-size:250% 100%;background-repeat:no-repeat;animation:shine 6s ease-in-out infinite}
  @keyframes shine{0%,55%{background-position:130% 0}100%{background-position:-130% 0}}
  .tab.on .i{animation:spring .35s cubic-bezier(.34,1.56,.64,1)}
  @keyframes spring{0%{transform:translateY(-1px) scale(.9)}60%{transform:translateY(-3px) scale(1.16)}100%{transform:translateY(-1px) scale(1.06)}}

  /* ---------- 环形热量进度（借鉴 NutriTrack 溢出环） ---------- */
  .calring{display:flex;align-items:center;gap:16px}
  .cal-ring{width:90px;height:90px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--ring-c,#4ade80) calc(var(--p,0)*1%),rgba(255,255,255,.08) 0);
    box-shadow:0 0 22px rgba(74,222,128,.16);transition:background .3s}
  .cal-ring-in{width:70px;height:70px;border-radius:50%;background:rgba(4,26,19,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
  .cal-ring-in b{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .cal-ring-in small{font-size:10.5px;opacity:.85;margin-top:3px}
  .cal-info{flex:1;min-width:0;font-size:13px;line-height:1.75}
  .cal-info .big{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .cal-info .over{color:var(--bad)}

  /* 玻璃更通透，透出彩色壁纸光斑（iOS 液态玻璃质感） */
  .card{background:linear-gradient(135deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.012) 30%,transparent 52%),
                   linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.018));
    backdrop-filter:blur(30px) saturate(175%);-webkit-backdrop-filter:blur(30px) saturate(175%);
    border:1px solid rgba(255,255,255,.12)}
  .hero{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%)}

  /* ---------- iOS 26 图标与排版精修 ---------- */
  /* squircle：圆角按尺寸比例缩放（iOS 图标圆角约边长的 22%~28%），而非固定 px */
  .gi{width:48px;height:48px;border-radius:28%;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.30), inset 0 -1px 1px rgba(0,0,0,.24), 0 4px 14px rgba(0,0,0,.42)}
  .gi svg{width:24px;height:24px}
  .gi.sm{width:42px;height:42px}
  .gi.sm svg{width:21px;height:21px}
  .gi.lg{width:64px;height:64px}
  .gi.lg svg{width:31px;height:31px}
  .tab.on .gi{transform:translateY(-2px) scale(1.02)}
  .tab:not(.on):active .gi{transform:scale(.9);filter:brightness(1.15)}
  /* SF Pro 式排版：大字号负字距、小字号正字距，层级更克制 */
  .art{font-size:32px;font-weight:800;letter-spacing:-.8px}
  .ph-s{font-size:13px;letter-spacing:.1px}
  .card-t{font-size:16px;font-weight:700;letter-spacing:-.2px}
  .card-t .sub{font-size:13px}
  .ckr-t{font-size:15px}
  .ckr-d{font-size:13px}
  .fd-n{font-size:15px}
  .fd-u{font-size:12px}
  .mini{font-size:12px}
  .st-n{font-size:18px}
  .macro-n{font-size:20px}
  .row-l{font-size:15px}
  .row-r .inp{font-size:17px}

  /* ---------- 首页聚合仪表盘 ---------- */
  .dash{padding:18px 16px}
  .dash-bf{display:flex;align-items:center;gap:16px}
  .dash-num{font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
  .dash-num small{font-size:17px;font-weight:600;color:var(--text-dim)}
  .dash-lv{font-size:16px;font-weight:700}
  .dash-meta{font-size:12px;color:var(--text-dim);margin-top:3px}
  .dash-row{display:flex;text-align:center;gap:6px;padding:13px 8px 6px}
  .dash-row .di{flex:1;min-width:0}
  .di-n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
  .di-l{font-size:11px;color:var(--text-dim);margin-top:3px}

  /* ---- 食物库：分类 chips / 清单行 / 环形图 ---- */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text-dim);
    font-family:inherit;font-size:12px;padding:5px 11px;border-radius:999px;cursor:pointer;transition:.18s}
  .chip.on{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.45);color:var(--brand);font-weight:700}
  .chip:active{transform:scale(.94)}
  .tot-bar{display:flex;flex-direction:column;gap:2px}
  .frow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
  .frow:last-child{border-bottom:0}
  .frow-l{flex:1;min-width:0}
  .frow-n{font-size:14.5px;font-weight:600;letter-spacing:-.2px}
  .frow-m{font-size:11.5px;color:var(--text-dim);margin-top:2px}
  .frow-r{display:flex;gap:6px;flex:none}
  .mini-btn{border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.13);color:var(--brand);
    font-family:inherit;font-size:12px;font-weight:600;padding:6px 11px;border-radius:9px;cursor:pointer;transition:.16s}
  .mini-btn:active{transform:scale(.92)}
  .mini-btn.danger{border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.12);color:#fb7185}
  .pie-row{display:flex;align-items:center;gap:14px;padding:6px 2px 2px}
  .pie-lg{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12.5px}
  .pie-dot{width:9px;height:9px;border-radius:3px;flex:none}
  .pie-n{font-weight:600;flex:1;min-width:0}
  .pie-v{color:var(--text-dim);font-size:11.5px;font-variant-numeric:tabular-nums;flex:none}

  /* =====================================================================
     Apple Liquid Glass 设计系统 v2（按 naplesblue/apple-design-skill 规范）
     原则：① 统一表面 > 碎片化卡片 ② 玻璃只在图层真正重叠处（吸顶导航/弹层/CTA）
           ③ 层级靠字重+字号+灰阶，颜色只留一个强调色 ④ 克制即奢侈
     ===================================================================== */
  :root{
    --ground:#070A08; --surface:#111511; --surface-2:#1D221E; --surface-3:#2A302B;
    --sep:#2A302B; --hairline:#1D221E;
    --t1:#F3F6F4; --t2:#A9B0AA; --t3:#7B837C;
    --accent:#56D57B; --accent-ink:#06210F; --accent-fill:#56D57B; --accent-soft:#142A1A;
    --green:#56D57B; --orange:#ffb020; --red:#ff5a4e; --purple:#b07cf7;
    --nav-bg:rgba(7,10,8,.72);
    --r-card:20px; --r-in:14px; --r-nav:30px;
    --shadow-card:0 1px 2px rgba(0,0,0,.4);
    /* 旧变量 → 新语义色（在 :root 里只声明一次，随主题自动切换） */
    --text:var(--t1); --text-dim:var(--t2); --text-mute:var(--t3);
    --brand:var(--accent); --brand-bg:var(--accent-soft); --brand-l:var(--accent-soft); --brand-d:var(--accent);
    --ok:var(--accent); --warn:var(--orange); --bad:var(--red); --great:var(--green);
    --line:var(--sep); --line-d:var(--sep);
    --glass:var(--surface); --glass-bd:0; --shadow:var(--shadow-card); --radius:var(--r-card); --bg:var(--ground);
  }
  [data-theme="light"]{
    --ground:#F1F5F1; --surface:#FBFEFC; --surface-2:#E8ECE9; --surface-3:#DADFDB;
    --sep:#DADFDB; --hairline:#E8ECE9;
    --t1:#141A15; --t2:#535A54; --t3:#6F7770;
    --accent:#00682A; --accent-ink:#FFFFFF; --accent-fill:#008130; --accent-soft:#DDECE3;
    --green:#00682A; --orange:#a35a00; --red:#c62a2f; --purple:#7c4ddb;
    --nav-bg:rgba(251,254,252,.80);
    --shadow-card:0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme]){
    --ground:#F1F5F1; --surface:#FBFEFC; --surface-2:#E8ECE9; --surface-3:#DADFDB;
      --sep:#DADFDB; --hairline:#E8ECE9;
      --t1:#141A15; --t2:#535A54; --t3:#6F7770;
      --accent:#00682A; --accent-ink:#FFFFFF; --accent-fill:#008130; --accent-soft:#DDECE3;
      --green:#00682A; --orange:#a35a00; --red:#c62a2f; --purple:#7c4ddb;
      --nav-bg:rgba(251,254,252,.80);
      --shadow-card:0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05);
    }
  }
  /* ---- 底板：不再用彩虹壁纸，回到克制的纯色地面 ---- */
  body{background:var(--ground)}
  .app{background:var(--ground);background-attachment:scroll}
  /* ---- 内容表面：实心 + 柔和阴影，不再磨砂、不再彩虹色差 ---- */
  .card{background:var(--surface);border:0;border-radius:var(--r-card);box-shadow:var(--shadow-card);
    backdrop-filter:none;-webkit-backdrop-filter:none;padding:16px;overflow:visible}
  .card::before,.card::after{content:none;display:none}
  .card:active{backdrop-filter:none;-webkit-backdrop-filter:none}
  .hint{background:var(--surface);border:0}
  .hero{background:var(--surface);border:0;box-shadow:var(--shadow-card)}
  .hero::before{content:none;display:none}
  .hero-ring-in{background:var(--surface)}
  /* ---- 顶部导航：玻璃（图层重叠，允许） ---- */
  .hd{background:var(--nav-bg);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:none;color:var(--t1)}
  .hd-t{font-size:17px;font-weight:600;letter-spacing:-.2px;color:var(--t1)}
  .hd-t::before{display:none}
  .hd-s{color:var(--t2);font-size:12px}
  .hd-b{background:var(--surface-2);border:0;color:var(--t1);font-weight:500;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
  /* ---- 大标题：Apple 大标题规格（负字距 + 紧凑行高） ---- */
  .art{font-size:33px;font-weight:700;letter-spacing:-.7px;line-height:1.12;color:var(--t1)}
  .ph{padding:10px 2px 2px;margin-bottom:10px}
  .ph-s{color:var(--t2);font-size:13px;margin-top:4px}
  .card-t{font-size:17px;font-weight:600;letter-spacing:-.2px;color:var(--t1);margin-bottom:10px}
  .card-t .sub{font-size:13px;font-weight:400;color:var(--t2)}
  .card-t .link{color:var(--accent);font-weight:500}
  /* ---- 底部导航：玻璃胶囊（二级导航层，允许） ---- */
  .tabs{background:var(--nav-bg);border:.5px solid var(--hairline);box-shadow:0 8px 34px rgba(0,0,0,.28);
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    border-radius:var(--r-nav);overflow:visible;padding:6px 7px calc(6px + var(--safe-b))}
  /* 中间凸起主动作：绝对定位，不参与布局（避免其它图标高低不齐） */
  .tab.mid{position:relative;padding-top:0;overflow:visible}
  .tab.mid .fab{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
    width:52px;height:52px;border-radius:17px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#7ef0a8,#22b866);color:#06210F;
    box-shadow:0 10px 26px rgba(34,184,102,.42), 0 2px 6px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.18);
    border:.5px solid rgba(255,255,255,.34);transition:transform .18s cubic-bezier(.32,.72,0,1)}
  .tab.mid .fab svg{width:25px;height:25px;color:#06210F}
  .tab.mid:active .fab{transform:translateX(-50%) scale(.93)}
  .tab.mid .t{margin-top:0}
  .tab.mid.on .t{color:var(--accent);font-weight:600}
  .tabs .glider{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:22px;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.12) 55%,rgba(255,255,255,.18));
    border:.5px solid rgba(255,255,255,.42);
    box-shadow:0 6px 20px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.65), inset 0 -1px 0 rgba(0,0,0,.14);
    backdrop-filter:blur(8px) saturate(190%);-webkit-backdrop-filter:blur(8px) saturate(190%);
    will-change:transform,width;transform:translateX(0)}
  /* 块内的高光/折射感 */
  .tabs .glider::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(60% 120% at 50% 0%,rgba(255,255,255,.55),transparent 62%)}
  .tabs .glider::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    padding:1px;
    background:conic-gradient(from 200deg,rgba(255,255,255,.55),rgba(255,255,255,0) 38%,rgba(255,255,255,.42) 72%,rgba(255,255,255,0));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    mask-composite:exclude;mix-blend-mode:screen}
  .tab{position:relative;z-index:1}
  .tabs::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
  .tab{color:var(--t3);border-radius:24px}
  .tab .t{color:inherit;font-size:10.5px;letter-spacing:.2px}
  .tab.on{color:var(--accent)}
  .tab.on .i{transform:translateY(-1px)}
  .tab.on::after{content:none;display:none}
  /* 图标恢复单色线框：不再是彩色圆角块（消除"廉价 AI 感"的关键一步） */
  .gi{width:auto;height:auto;border-radius:0;background:none!important;border:0;box-shadow:none!important;padding:0}
  .gi svg{width:24px;height:24px;color:inherit!important;filter:none!important;text-shadow:none}
  .gi.sm svg{width:20px;height:20px}
  .gi.lg{width:auto;height:auto;border-radius:0}
  .gi.lg svg{width:34px;height:34px;opacity:.9}
  /* 选中态只用强调色区分，不加任何块/光晕 */
  .tab.on .gi{box-shadow:none!important;transform:none!important;background:none!important}
  .tab:not(.on) .gi{filter:none!important}
  .tab:not(.on):active .gi{transform:scale(.92)}
  .tab .gi svg{width:25px;height:25px}
  /* ---- iOS 大标题折叠：顶部导航标题默认隐藏，滚动后才浮现 ---- */
  .hd-t,.hd-s{opacity:0;transition:opacity .22s ease}
  .hd.scrolled .hd-t{opacity:1}
  .hd.scrolled .hd-s{opacity:0}
  /* ---- 弹层 / 提示：玻璃（悬浮层，允许） ---- */
  .sheet{background:var(--nav-bg);border:.5px solid var(--hairline);border-bottom:0;
    backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
    box-shadow:0 -10px 44px rgba(0,0,0,.34);border-radius:20px 20px 0 0;color:var(--t1)}
  .sh-h{background:var(--t3)}
  .sh-t{font-size:17px;font-weight:600;letter-spacing:-.2px}
  .toast{background:var(--surface-2);color:var(--t1);box-shadow:0 10px 34px rgba(0,0,0,.35);border:.5px solid var(--hairline);font-weight:500}
  .mask{background:rgba(0,0,0,.42)}
  /* ---- 控件：Apple 规格（主按钮=强调色胶囊；次按钮=灰面） ---- */
  .btn{background:var(--accent-fill);color:var(--accent-ink);border:0;border-radius:980px;font-weight:600;letter-spacing:-.1px;
    box-shadow:none;padding:14px 22px;transition:transform .16s cubic-bezier(.32,.72,0,1),filter .16s}
  .btn::after{content:none;display:none}
  .btn:active{transform:scale(.97);filter:brightness(1.06)}
  .btn.ghost,.btn.gray,.btn.sm.gray{background:var(--surface-2);color:var(--t1);box-shadow:none;border:0}
  .btn.sm{padding:9px 16px;font-size:13.5px;border-radius:980px}
  .mini-btn{background:var(--surface-2);color:var(--accent);border:0;border-radius:980px;font-weight:600}
  .chip,.qk button{background:var(--surface-2);border:0;color:var(--t2);border-radius:980px;font-weight:500}
  .chip.on,.qk button.on{background:var(--accent);color:#fff;border:0}
  .inp,.srch{background:var(--surface-2);border:0;color:var(--t1);border-radius:var(--r-in)}
  .inp::placeholder,.srch::placeholder{color:var(--t3)}
  /* ---- 行/列表：统一表面 + 发丝分隔线（不再一堆独立卡片） ---- */
  .frow,.log,.fd,.ck-row,.goal,.mst .m{border-bottom:.5px solid var(--hairline);border-radius:0;background:none}
  .frow:last-child,.log:last-child,.fd:last-child{border-bottom:0}
  .goal{border:.5px solid var(--hairline);border-radius:var(--r-in);background:var(--surface-2)}
  .goal.on{background:var(--accent-soft);border-color:var(--accent);box-shadow:none}
  .mst .m{background:var(--surface-2);border:.5px solid var(--hairline);border-radius:var(--r-in)}
  .mst .m.eaten{background:rgba(48,209,88,.14);border-color:rgba(48,209,88,.42)}
  .mst .m.missed{background:rgba(255,69,58,.12);border-color:rgba(255,69,58,.36)}
  /* ---- 文字灰阶层级（正文黑白灰，颜色只留给强调） ---- */
  body{color:var(--t1)}
  .mini,.ph-s,.frow-m,.log-s,.card-t .sub{color:var(--t2)}
  .empty,.hint{color:var(--t2)}
  .hero-num,.ring-n,.macro-n,.st-n,.rec-n,.fd-k,.log-k,.tab .t{font-variant-numeric:tabular-nums}
  /* ---- 圆环 / 数值：回归灰阶层级（颜色只留给强调与操作） ---- */
  .cal-ring-in,.hero-ring-in{background:var(--surface-2);color:var(--t1)}
  .hero-ring-in b,.cal-ring-in b{color:var(--t1)}
  .fd-k,.log-k{color:var(--t1);font-weight:600}
  .meal-c,.fd-u,.hero-sub{color:var(--t2)}
  /* ---- 运动仪表盘：数据小方块 + 大数字（参考深色运动 App） ---- */
  .dash-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:none;border:0;box-shadow:none;padding:0;margin-bottom:13px}
  .di{background:var(--surface-2);border:.5px solid var(--hairline);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
  .di-n{font-size:22px;font-weight:700;letter-spacing:-.6px;line-height:1.15;color:var(--t1)}
  .di-l{font-size:11.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .mst{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px}
  .mst .m{border-radius:18px;padding:11px 12px;display:flex;flex-direction:column;gap:4px}
  .mst .m .t{font-size:12px;color:var(--t2);display:flex;align-items:center;gap:5px}
  .mst .m .s{font-size:14px;font-weight:600;color:var(--t1)}
  .dash{background:linear-gradient(150deg,rgba(62,209,127,.18),rgba(62,209,127,.03) 62%),var(--surface)}
  .dash-num{font-size:44px;font-weight:800;letter-spacing:-1.6px;line-height:1}
  /* 底部中间主按钮：亮绿（运动风） */
  .tab.mid .fab{background:linear-gradient(160deg,#7ef0a8,#22b866);box-shadow:0 10px 26px rgba(34,184,102,.42),0 2px 6px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.18)}
  .tab.mid.on .t{color:var(--accent)}
  /* 主题切换行 */
  .seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:none;color:var(--t1);font-family:inherit;font-size:13px;font-weight:500;padding:7px 0;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
  /* 弹层内的分组：扁平、无阴影（Apple 设置面板形态） */
  .sheet .card{background:var(--surface-2);border:0!important;box-shadow:none!important;margin-bottom:10px}
  .sheet .card-t{font-size:15px;margin-bottom:8px}

  /* =====================================================================
     v2 排版 · 材质层
     排版：html 100% → body 1rem(16px) × 1.5 = 24px 垂直韵律；
           tracking 随字号变化（大号收紧、小字放开）【apple-design §15】
     材质：吸顶栏用滚动边缘渐隐替代硬分隔线、弹层入场"材质化"【apple-design §12】
     ===================================================================== */
  html{font-size:100%}                                  /* 尊重系统字号设置 */
  body{font-size:1rem;line-height:1.5}                  /* 16 × 1.5 = 24px 韵律基准 */

  /* tracking 随字号：大号收紧、小字略放开（不再一刀切） */
  .hero-num,.hero-ring-in b,.kpi-b,.big-num{letter-spacing:-.022em}
  .mini,.mini-btn,.hd-s,.t-lab,.unit,.fd-u{letter-spacing:.01em}

  /* 吸顶栏：去硬 1px 线，改为内容滚到栏下的边缘渐隐 */
  .hd::after{content:'';position:absolute;left:0;right:0;top:100%;height:13px;pointer-events:none;
    background:linear-gradient(180deg,var(--nav-bg),transparent);opacity:.9}

  /* 弹层入场"材质化"：blur 与位移同步，而非纯淡入 */
  .sheet{transition:transform .26s cubic-bezier(.32,.72,0,1), backdrop-filter .26s ease, -webkit-backdrop-filter .26s ease}
  .sheet.off,.sheet:not(.on){backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px)}

  /* 减弱动效：交叉淡入，不做弹簧与位移 */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;
      transition-duration:.01ms !important;scroll-behavior:auto !important}
    .sheet{transition:opacity .12s linear !important}
  }

  /* =====================================================================
     玻璃增强（v2）—— 追加在样式表末尾以确保生效（后面的规则优先级更高）
     背景：实测 Chromium 的 backdrop-filter 不支持 url(#svgFilter)
     （maxDisp 13→80 渲染完全无变化），故改用纯 CSS 视觉等效方案：
       ① blur + saturate + brightness —— 唯一真生效的模糊层
       ② 棱边：外描边 + 顶边高光 + 底边内阴影 → 玻璃"厚度"
       ③ 色散：极淡环向彩边（mask 只留 1px 边框 + screen 混合）→ 棱镜感
       ④ 上棱折射亮带 → 光打上去的观感
     ===================================================================== */
  .tabs, .sheet, .hd{
    background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.055) 58%,rgba(255,255,255,.085));
    backdrop-filter:blur(30px) saturate(215%) brightness(1.07);
    -webkit-backdrop-filter:blur(30px) saturate(215%) brightness(1.07);
    box-shadow:
      0 22px 52px rgba(0,0,0,.5),
      0 3px 10px rgba(0,0,0,.28),
      inset 0 1px 0 rgba(255,255,255,.58),
      inset 0 -1.5px 0 rgba(0,0,0,.32),
      inset 0 0 0 1px rgba(255,255,255,.14);
  }
  .tabs::before{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;z-index:1;
    background:linear-gradient(150deg,
      rgba(190,255,220,.5),rgba(160,215,255,.32) 34%,
      rgba(255,190,235,.24) 58%,rgba(180,255,225,.38) 82%,rgba(255,255,255,.4));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
    mix-blend-mode:screen;opacity:.28;
  }
  .tabs::after{
    content:'';position:absolute;left:4%;right:4%;top:1px;height:32%;border-radius:inherit;pointer-events:none;z-index:1;
    background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,.05) 58%,transparent);
    mix-blend-mode:screen;opacity:.7;
  }

<!-- file:// fetch 垫片：必须早于 ort.min.js 执行。
     WebView 用 file:// 加载本页面，而 ort-web 内部用 fetch 请求 wasm 与模型，
     浏览器禁止 fetch("file://...")（"URL scheme file is not supported"）。
     这里在遇到 file:// 时改走 XMLHttpRequest（file:// 下可用），并补齐
     application/wasm 的 Content-Type，使 instantiateStreaming 能正常工作。 -->
<script>
(function () {
  var _fetch = (typeof window.fetch === 'function') ? window.fetch.bind(window) : null
  function mimeFor(u){
    if (/\.wasm(\?|$)/i.test(u)) return 'application/wasm'
    if (/\.onnx(\?|$)/i.test(u)) return 'application/octet-stream'
    return 'application/octet-stream'
  }
  function viaXhr(url){
    return new Promise(function (res, rej){
      var x = new XMLHttpRequest()
      x.open('GET', url, true)
      x.responseType = 'arraybuffer'
      x.onload = function (){
        if (x.status === 0 || (x.status >= 200 && x.status < 300)){
          try { res(new Response(x.response, { status:200, headers:{ 'Content-Type': mimeFor(url) } })) }
          catch (e) { rej(e) }
        } else rej(new TypeError('HTTP ' + x.status + ' for ' + url))
      }
      x.onerror = function (){ rej(new TypeError('Failed to fetch ' + url)) }
      try { x.send() } catch (e) { rej(e) }
    })
  }
  window.fetch = function (input, init){
    var url = (typeof input === 'string') ? input : (input && input.url) || ''
    if (url.indexOf('file://') === 0) return viaXhr(url)
    /* 页面本身是 file:// 时，相对路径请求（ort 的 wasmPaths='./' 与模型文件名）也一并走 XHR，
       否则会漏到原生 fetch 被 "URL scheme file is not supported" 拒绝 */
    if (url && location.protocol === 'file:' && !/^(https?:|data:|blob:|about:)/i.test(url)){
      try {
        var abs = new URL(url, location.href).href
        if (abs.indexOf('file://') === 0) return viaXhr(abs)
      } catch (e) {}
    }
    if (_fetch) return _fetch(input, init)
    return Promise.reject(new TypeError('fetch unavailable'))
  }
})()
</script>

/* ------------------------------ 存储 ------------------------------ */
var Store = (function () {
  var RK = 'bf_records_v1', PK = 'bf_plan_v1', CK = 'bf_checkin_v1', LK = 'bf_cal_v1', UF = 'bf_user_foods_v1', CFG = 'bf_cfg_v1', AIK = 'bf_ai_cfg_v1'
  function read(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch (e) { return d } }
  function write(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); autoBackup(); return true } catch (e) { toast('存储失败，空间可能不足'); return false } }
  function remove(k){ try { localStorage.removeItem(k); autoBackup() } catch (e) {} }

  function records(){ return read(RK, []) }
  function addRecord(r){ var a = records(); a.push(r); write(RK, a); return r }
  function delRecord(id){ write(RK, records().filter(function (x){ return x.id !== id })) }
  function clearRecords(){ remove(RK); remove(PK) }

  function plan(){ return read(PK, null) }
  function savePlan(p){ write(PK, p); return p }
  function clearPlan(){ remove(PK) }

  function checkin(date){ var all = read(CK, {}); return all[date] || {} }
  function setCheckin(date, part){ var all = read(CK, {}); var c = all[date] || {}; for (var k in part) c[k] = part[k]; all[date] = c; write(CK, all) }

  function logs(date){ var all = read(LK, {}); return all[date] || [] }
  function addLog(date, item){ var all = read(LK, {}); var a = all[date] || []; a.push(item); all[date] = a; write(LK, all) }
  function delLog(date, id){ var all = read(LK, {}); all[date] = (all[date] || []).filter(function (x){ return x.id !== id }); write(LK, all) }

  function userFoods(){ return read(UF, []) }
  function saveUserFoods(a){ write(UF, a) }

  function cfg(){ return read(CFG, null) }
  function saveCfg(c){ write(CFG, c) }

  function aiCfg(){ return read(AIK, null) }
  function saveAiCfg(c){ write(AIK, c) }

  function exportAll(){
    return { app:'bodyfat', v:1, exportedAt:new Date().toISOString(),
      records:records(), plan:plan(), checkin:read(CK, {}), logs:read(LK, {}), userFoods:userFoods(),
      sessions:sessions(), active:activeSession(), userEx:userEx() }
  }
  function importAll(data){
    if (!data || data.app !== 'bodyfat') return false
    if (Array.isArray(data.records)) write(RK, data.records)
    if (data.plan) write(PK, data.plan)
    if (data.checkin) write(CK, data.checkin)
    if (data.logs) write(LK, data.logs)
    if (Array.isArray(data.userFoods)) write(UF, data.userFoods)
    if (Array.isArray(data.sessions)) write(TK, data.sessions)
    if (Array.isArray(data.userEx)) write(EK, data.userEx)
    if (data.active) setActiveSession(data.active)
    return true
  }
  function clearAll(){ [RK, PK, CK, LK, TK, EK, AK].forEach(remove) }

  /* ---- 训练记录（v1.0）---- */
  var TK = 'bf_train_v1', EK = 'bf_ex_v1', AK = 'bf_active_v1'
  function sessions(){ return read(TK, []) }
  function sessionById(id){ var a = sessions(); for (var i = 0; i < a.length; i++){ if (a[i].id === id) return a[i] } return null }
  function saveSession(s){
    var a = sessions(), i = -1
    for (var j = 0; j < a.length; j++){ if (a[j].id === s.id){ i = j; break } }
    if (i >= 0) a[i] = s; else a.push(s)
    write(TK, a); return s
  }
  function delSession(id){ write(TK, sessions().filter(function (x){ return x.id !== id })) }
  function sessionsByDate(date){ return sessions().filter(function (x){ return x.date === date }) }
  function sessionsInRange(from, to){ return sessions().filter(function (x){ return x.date >= from && x.date <= to }) }
  /* 正在进行的训练：用于「继续上次」。单独存一个键，App 被杀掉也不丢 */
  function activeSession(){ return read(AK, null) }
  function setActiveSession(sv){ if (sv) write(AK, sv); else remove(AK) }
  /* 自定义动作 */
  function userEx(){ return read(EK, []) }
  function saveUserEx(a){ write(EK, a) }

  /* 本地自动备份：每次写入后把全量快照落到独立键（绕过 write 防止递归） */
  var BK = 'bf_backup_auto_v1'
  function autoBackup(){
    try { var snap = exportAll(); snap._ts = Date.now(); localStorage.setItem(BK, JSON.stringify(snap)) } catch (e) {}
  }
  function latestBackup(){ try { var v = localStorage.getItem(BK); return v ? JSON.parse(v) : null } catch (e) { return null } }

  return { records:records, addRecord:addRecord, delRecord:delRecord, clearRecords:clearRecords,
    plan:plan, savePlan:savePlan, clearPlan:clearPlan,
    checkin:checkin, setCheckin:setCheckin,
    logs:logs, addLog:addLog, delLog:delLog,
    sessions:sessions, sessionById:sessionById, saveSession:saveSession, delSession:delSession,
    sessionsByDate:sessionsByDate, sessionsInRange:sessionsInRange,
    activeSession:activeSession, setActiveSession:setActiveSession,
    userEx:userEx, saveUserEx:saveUserEx,
    userFoods:userFoods, saveUserFoods:saveUserFoods,
    cfg:cfg, saveCfg:saveCfg, aiCfg:aiCfg, saveAiCfg:saveAiCfg,
    exportAll:exportAll, importAll:importAll, clearAll:clearAll,
    autoBackup:autoBackup, latestBackup:latestBackup }
})()

var AppCfg = {
  defaultMeals: {
    breakfast: { label:'早餐', emoji:'🌅', start:'05:00', end:'09:30' },
    lunch:     { label:'午餐', emoji:'☀️', start:'11:00', end:'13:30' },
    dinner:    { label:'晚餐', emoji:'🌙', start:'17:00', end:'20:30' }
  },
  _m: null,
  meals: function () {
    if (this._m) return this._m
    var c = Store.cfg()
    this._m = (c && c.meals) ? c.meals : JSON.parse(JSON.stringify(this.defaultMeals))
    return this._m
  },
  /* 统一取三餐/加餐的元信息（snack 不在三餐时间窗里，单独兜底） */
  mealMeta: function (key) {
    if (key === 'snack') return { label:'加餐', emoji:'🍎', start:'00:00', end:'23:59' }
    return this.meals()[key] || { label:'加餐', emoji:'🍎', start:'00:00', end:'23:59' }
  },
  saveMeals: function (m) { var c = Store.cfg() || {}; c.meals = m; Store.saveCfg(c); this._m = null },
  mealKeys: function () { return ['breakfast', 'lunch', 'dinner'] },
  /* 当前时间对应哪一餐（用于记餐自动归类） */
  currentMeal: function () {
    var mins = nowMinutes(), m = this.meals()
    if (mins <= hmToMin(m.breakfast.end)) return 'breakfast'
    if (mins <= hmToMin(m.lunch.end)) return 'lunch'
    if (mins <= hmToMin(m.dinner.end)) return 'dinner'
    return 'snack'
  },
  /* 某一餐在指定日期的状态：eaten / missed / open / upcoming */
  mealStatus: function (dateISO, key) {
    var m = this.mealMeta(key)
    var kcal = Store.logs(dateISO).filter(function (x){ return x.meal === key }).reduce(function (s, x){ return s + x.kcal }, 0)
    if (kcal > 0) return { state:'eaten', kcal:kcal, label:m.label, emoji:m.emoji }
    var today = todayISO()
    if (dateISO < today) return { state:'missed', kcal:0, label:m.label, emoji:m.emoji }
    if (dateISO > today) return { state:'upcoming', kcal:0, label:m.label, emoji:m.emoji }
    var mins = nowMinutes()
    if (mins < hmToMin(m.start)) return { state:'upcoming', kcal:0, label:m.label, emoji:m.emoji }
    if (mins < hmToMin(m.end)) return { state:'open', kcal:0, label:m.label, emoji:m.emoji }
    return { state:'missed', kcal:0, label:m.label, emoji:m.emoji }
  },
  STATUS_TEXT: { eaten:'已吃', missed:'没吃', open:'进行中', upcoming:'未到' },
  SHARE: { breakfast:0.25, lunch:0.35, dinner:0.30, snack:0.10 }
}

/* ------------------------------ 体脂算法引擎 ------------------------------ */
var Engine = (function () {
  function bmi(w, h){ if (!w || !h) return NaN; return w / Math.pow(h / 100, 2) }
  function navy(gender, waist, neck, hip, height){
    if (gender === 'm'){
      var wm = waist - neck; if (!(wm > 0)) return NaN
      return 495 / (1.0324 - 0.19077 * Math.log10(wm) + 0.15456 * Math.log10(height)) - 450
    }
    var wf = waist + hip - neck; if (!(wf > 0)) return NaN
    return 495 / (1.29579 - 0.35004 * Math.log10(wf) + 0.22100 * Math.log10(height)) - 450
  }
  function deurenberg(gender, age, b){ return 1.20 * b + 0.23 * age - 10.8 * (gender === 'm' ? 1 : 0) - 5.4 }
  function level(gender, bf){
    if (!isFinite(bf)) return { key:'unknown', label:'--', tone:'ok', range:'' }
    var t = (gender === 'm')
      ? [ [6,'low'],[14,'athlete'],[18,'fit'],[25,'average'],[35,'obese'],[999,'obese2'] ]
      : [ [14,'low'],[21,'athlete'],[25,'fit'],[32,'average'],[42,'obese'],[999,'obese2'] ]
    for (var i = 0; i < t.length; i++){ if (bf < t[i][0]) return map(t[i][1], gender) }
    return map('obese2', gender)
  }
  function map(key, gender){
    var m = {
      low:     { label:'体脂偏低', tone:'warn',  range: gender === 'm' ? '男 <6%'   : '女 <14%' },
      athlete: { label:'运动员型', tone:'great', range: gender === 'm' ? '男 6–13%'  : '女 14–20%' },
      fit:     { label:'健美型',   tone:'great', range: gender === 'm' ? '男 14–17%' : '女 21–24%' },
      average: { label:'正常范围', tone:'ok',    range: gender === 'm' ? '男 18–24%' : '女 25–31%' },
      obese:   { label:'偏高',     tone:'warn',  range: gender === 'm' ? '男 25–34%' : '女 32–41%' },
      obese2:  { label:'肥胖',     tone:'bad',   range: gender === 'm' ? '男 ≥35%'   : '女 ≥42%' }
    }
    var o = m[key]; return { key:key, label:o.label, tone:o.tone, range:o.range }
  }
  function toneColor(t){ return { great:'var(--great)', ok:'var(--ok)', warn:'var(--warn)', bad:'var(--bad)' }[t] || 'var(--ok)' }
  function idealWeight(h){ var x = h / 100; return { min:Math.round(18.5 * x * x * 10) / 10, max:Math.round(23.9 * x * x * 10) / 10 } }
  function fatMass(w, bf){ return w * bf / 100 }
  function leanMass(w, bf){ return w - w * bf / 100 }
  function profileFromRecord(r){
    if (!r) return null
    return { gender:r.gender, age:r.age, heightCm:r.heightCm, weightKg:r.weightKg, bf:r.bf, bmi:r.bmi }
  }
  return { bmi:bmi, navy:navy, deurenberg:deurenberg, level:level, toneColor:toneColor, idealWeight:idealWeight, fatMass:fatMass, leanMass:leanMass, profileFromRecord:profileFromRecord }
})()

  function all(){ return FOODS }
  function categories(){
    var s = {}, out = []; FOODS.forEach(function (f){ if (!s[f.cat]) { s[f.cat] = 1; out.push(f.cat) } }); return out
  }
  function byName(name){
    for (var i = 0; i < FOODS.length; i++){ if (FOODS[i].name === name) return FOODS[i] }
    return null
  }
  /* 搜索：名称命中优先于分类命中，且匹配位置越靠前排越前。
     否则搜「奶」会被「分类=豆奶」的豆腐类抢走前几条（库扩到 1,800 条后噪音会很明显）。 */
  function search(q, cat){
    var k = (q || '').trim().toLowerCase()
    if (!k) return FOODS.filter(function (f){ return !cat || f.cat === cat })
    var byName = [], byCat = []
    for (var i = 0; i < FOODS.length; i++){
      var f = FOODS[i]
      if (cat && f.cat !== cat) continue
      if (f.name.toLowerCase().indexOf(k) >= 0) byName.push(f)
      else if (f.cat.indexOf(k) >= 0) byCat.push(f)
    }
    byName.sort(function (a, b){
      return a.name.toLowerCase().indexOf(k) - b.name.toLowerCase().indexOf(k)
    })
    return byName.concat(byCat)
  }
  function calc(food, grams){ return Math.round(food.kcal * grams / 100) }
  /* 新增（或返回已存在）食物；识别/手动新增时自动入库 */
  function ensure(name, kcal, cat, def){
    var f = byName(name)
    if (f) return f
    f = { id:uid(), name:name, kcal:(kcal && kcal > 0) ? kcal : 150, cat:cat || '其他', def:(def && def > 0) ? def : 100 }
    FOODS.push(f)
    var u = Store.userFoods(); u.push({ id:f.id, name:f.name, kcal:f.kcal, cat:f.cat, def:f.def }); Store.saveUserFoods(u)
    return f
  }
  function recommend(remain){
    if (!(remain > 0)) return []
    return FOODS.filter(function (f){ var k = calc(f, f.def); return k > 0 && k <= remain && f.cat !== '调味' && f.cat !== '油脂' })
      .sort(function (a, b){ return calc(b, b.def) - calc(a, a.def) }).slice(0, 6)
  }
  /* 按餐别推荐：结合该餐剩余热量（早/午/晚常见食物池） */
  var MEAL_POOL = {
    breakfast: ['鸡蛋','牛奶(全脂)','燕麦片(干)','全麦面包','豆浆(无糖)','香蕉','酸奶(无糖)','玉米(鲜)','白粥','包子(肉)','油条','豆腐脑','卤蛋'],

    dinner:    ['三文鱼','鳕鱼','虾','北豆腐','西兰花','番茄','红薯','生菜','紫薯','白切鸡','鸡汤','冬瓜','豆角'],
    snack:     ['苹果','酸奶(无糖)','杏仁','蓝莓','圣女果','鸡蛋','香蕉','海苔','橙子']
  }
  function mealRecommend(mealKey, remain){
    var pool = MEAL_POOL[mealKey] || MEAL_POOL.snack
    var items = pool.map(byName).filter(Boolean)
    if (remain > 0) return items.filter(function (f){ return calc(f, f.def) <= remain }).sort(function (a, b){ return calc(b, b.def) - calc(a, a.def) }).slice(0, 6)
    /* 该餐已超量：推荐低卡轻食 */
    return FOODS.filter(function (f){ return f.kcal > 0 && f.kcal <= 60 }).sort(function (a, b){ return a.kcal - b.kcal }).slice(0, 6)
  }
  /* 删除用户自定义食物（内置食物不可删，返回 false 交由上层提示） */
  function removeUser(id){
    var idx = -1
    for (var i = 0; i < FOODS.length; i++){ if (FOODS[i].id === id) { idx = i; break } }
    if (idx < 0) return false
    var target = FOODS[idx]
    var isUser = Store.userFoods().some(function (u){ return u.id === id })
    if (!isUser) return false
    FOODS.splice(idx, 1)
    Store.saveUserFoods(Store.userFoods().filter(function (u){ return u.id !== id }))
    return !!target
  }
  /* ---- 扩展食物库：按需加载 foods.json（《中国食物成分表标准版》第6版，约 1,570 条中餐数据）
         —— 独立文件而非内嵌，保证主页面体积不变；加载完与内置库合并并按名称去重 ---- */
  var extra = { done:false, add:0, failed:false }
  function loadExtra(){
    if (extra.done) return Promise.resolve(extra.add)
    extra.done = true
    return new Promise(function (resolve){
      var x = new XMLHttpRequest()
      try { x.open('GET', 'foods.json', true) } catch (e) { extra.failed = true; resolve(0); return }
      x.onload = function (){
        var add = 0
        try {
          var arr = JSON.parse(x.responseText)
          if (arr && arr.length){
            var seen = {}
            FOODS.forEach(function (f){ seen[f.name] = 1 })
            for (var i = 0; i < arr.length; i++){
              var r = arr[i]
              if (!r || !r[0] || seen[r[0]]) continue
              seen[r[0]] = 1
              FOODS.push({ id:uid(), name:r[0], kcal:r[1], cat:r[2], def:r[3],
                           p:r[4], f:r[5], c:r[6], ext:true })
              add++
            }
          }
        } catch (e) { extra.failed = true }
        extra.add = add
        resolve(add)
      }
      x.onerror = function (){ extra.failed = true; resolve(0) }
      x.send()
    })
  }
  function extraInfo(){ return extra }

  return { all:all, categories:categories, byName:byName, search:search, calc:calc, ensure:ensure,
           recommend:recommend, mealRecommend:mealRecommend, removeUser:removeUser,
           loadExtra:loadExtra, extraInfo:extraInfo }
})()

    ['co11','鸟狗式','核心','自重','臀,竖脊肌','3×12/侧',['co10','co04','bk13']],
    ['co12','登山跑','核心','自重','肩,髋屈肌','3×30秒',['co13','co06','cd08']],
    ['co13','空中蹬车','核心','自重','—','3×20',['co06','co14','co12']],
    ['co14','仰卧交替触踝','核心','自重','—','3×20',['co06','co13','co12']],
    ['co15','农夫行走','核心','哑铃','斜方肌,前臂','3×30米',['bk19','bk20','co04']],
    ['co16','悬垂卷腹','核心','自重','前臂','3×12',['co03','co02','co07']],
    ['cd01','跑步机','有氧','器械','腿,心肺','1×30分',['cd02','cd04','cd03']],
    ['cd02','椭圆机','有氧','器械','腿,心肺','1×30分',['cd04','cd01','cd03']],
    ['cd03','划船机','有氧','器械','背,腿,心肺','1×20分',['cd01','cd02','cd04']],
    ['cd04','动感单车','有氧','器械','腿,心肺','1×30分',['cd02','cd01','cd05']],
    ['cd05','跳绳','有氧','自重','腿,心肺','3×3分',['cd08','cd07','cd06']],
    ['cd06','战绳','有氧','绳索','肩,核心','3×30秒',['cd07','cd05','cd08']],
    ['cd07','波比跳','有氧','自重','全身','3×12',['cd08','cd05','co12']],
    ['cd08','高抬腿','有氧','自重','核心,腿','3×45秒',['cd07','cd05','co12']],
  ]
  var EX = RAW.map(function (r){ return { id:r[0], name:r[1], muscle:r[2], equip:r[3], also:r[4], rec:r[5], alt:r[6] } })
  var MAP = {}
  EX.forEach(function (e){ MAP[e.id] = e })

  var MUSCLES = ['胸', '背', '腿', '肩', '手臂', '核心', '有氧']

  /* 内置 + 自定义 */
  function all(){
    var u = Store.userEx() || []
    return u.length ? EX.concat(u) : EX
  }
  function byId(id){
    if (MAP[id]) return MAP[id]
    var u = Store.userEx() || []
    for (var i = 0; i < u.length; i++){ if (u[i].id === id) return u[i] }
    return null
  }
  function byName(n){
    var a = all()
    for (var i = 0; i < a.length; i++){ if (a[i].name === n) return a[i] }
    return null
  }
  function muscles(){ return MUSCLES.slice() }
  /* 搜索：名称命中优先于肌群命中 */
  function search(q, muscle){
    var k = (q || '').trim().toLowerCase()
    var src = all().filter(function (e){ return !muscle || e.muscle === muscle })
    if (!k) return src
    var byN = [], byM = []
    for (var i = 0; i < src.length; i++){
      var e = src[i]
      if (e.name.toLowerCase().indexOf(k) >= 0) byN.push(e)
      else if ((e.muscle + e.equip).indexOf(k) >= 0) byM.push(e)
    }
    byN.sort(function (a, b){ return a.name.toLowerCase().indexOf(k) - b.name.toLowerCase().indexOf(k) })
    return byN.concat(byM)
  }
  /* 同类替代：器械被占用时的一键换动作 */
  function altsOf(id){
    var e = byId(id); if (!e) return []
    return (e.alt || []).map(byId).filter(Boolean)
  }
  function addUserEx(name, muscle, equip, alt){
    var u = Store.userEx() || []
    var e = { id:'u' + Date.now().toString(36), name:name, muscle:muscle || '其他', equip:equip || '其他',
              also:'', rec:'3×10', alt:alt || [], user:true }
    u.push(e); Store.saveUserEx(u); return e
  }
  function delUserEx(id){
    var u = (Store.userEx() || []).filter(function (x){ return x.id !== id })
    Store.saveUserEx(u); return true
  }

  /* ---------- 容量口径（规范 §3.3）：仅正式组；自重不计入，单独统计 ---------- */
  function volumeOf(sv){
    return Math.round((sv.sets || []).reduce(function (s, x){
      return s + (x.isWarmup ? 0 : ((x.weightKg || 0) * (x.reps || 0)))
    }, 0))
  }
  function setCount(sv){ return (sv.sets || []).filter(function (x){ return !x.isWarmup }).length }
  function warmupCount(sv){ return (sv.sets || []).filter(function (x){ return x.isWarmup }).length }
  function bodyweightSets(sv){ return (sv.sets || []).filter(function (x){ return !x.isWarmup && !(x.weightKg > 0) }).length }
  function durationMin(sv){
    if (!sv.startTs) return 0
    return Math.max(0, Math.round(((sv.endTs || Date.now()) - sv.startTs) / 60000))
  }
  /* Epley 估算 1RM */
  function est1RM(w, reps){
    if (!(w > 0) || !(reps > 0)) return 0
    return Math.round(w * (1 + reps / 30) * 10) / 10
  }
  /* 某动作的三种 PR 口径 */
  function prOf(exId){
    var best = { maxWeight:0, maxVolume:0, best1RM:0, date:'' }
    Store.sessions().forEach(function (sv){
      (sv.sets || []).forEach(function (x){
        if (x.isWarmup || x.exId !== exId) return
        var w = x.weightKg || 0, r = x.reps || 0
        var e1 = est1RM(w, r)
        if (w > best.maxWeight) best.maxWeight = w
        if (w * r > best.maxVolume) best.maxVolume = w * r
        if (e1 > best.best1RM){ best.best1RM = e1; best.date = sv.date }
      })
    })
    return best
  }
  /* 某动作的历史最佳一次（用于训练中「上次」提示） */
  function lastOf(exId){
    var arr = Store.sessions().slice().sort(function (a, b){ return (b.startTs || 0) - (a.startTs || 0) })
    for (var i = 0; i < arr.length; i++){
      var sets = (arr[i].sets || []).filter(function (x){ return x.exId === exId && !x.isWarmup })
      if (sets.length){
        var top = sets.slice().sort(function (a, b){ return (b.weightKg || 0) - (a.weightKg || 0) })[0]
        return { weightKg:top.weightKg, reps:top.reps, sets:sets.length, date:arr[i].date }
      }
    }
    return null
  }
  /* 本次训练是否破了某个动作的 PR（对比该次之前的历史） */
  function prsIn(sv){
    var out = []
    var earlier = Store.sessions().filter(function (x){ return x.id !== sv.id && (x.startTs || 0) < (sv.startTs || 0) })
    var byEx = {}
    ;(sv.sets || []).forEach(function (x){
      if (x.isWarmup) return
      byEx[x.exId] = byEx[x.exId] || []
      byEx[x.exId].push(x)
    })
    Object.keys(byEx).forEach(function (k){
      var bestBefore = 0, bestNow = 0
      earlier.forEach(function (s2){
        (s2.sets || []).forEach(function (x){
          if (!x.isWarmup && x.exId === k) bestBefore = Math.max(bestBefore, est1RM(x.weightKg, x.reps))
        })
      })
      byEx[k].forEach(function (x){ bestNow = Math.max(bestNow, est1RM(x.weightKg, x.reps)) })
      if (bestNow > bestBefore && bestBefore > 0) out.push({ exId:k, name:(byId(k) || {}).name || k, e1rm:bestNow })
    })
    return out
  }
  /* 近 n 周容量趋势 */
  function weeklyVolume(n){
    var out = [], now = Date.now()
    for (var i = n - 1; i >= 0; i--){
      var end = now - i * 7 * 86400000, start = end - 7 * 86400000
      var v = 0
      Store.sessions().forEach(function (sv){
        if ((sv.startTs || 0) >= start && (sv.startTs || 0) < end) v += volumeOf(sv)
      })
      out.push(v)
    }
    return out
  }
  /* 近 n 天肌群占比 —— 按「有效组数」分配（不按容量）。
     否则自重动作（引体/俯卧撑）重量为 0 会被整个忽略，练背的人会看到「背 0%」。 */
  function muscleSplit(n){
    var since = Date.now() - n * 86400000, m = {}
    Store.sessions().forEach(function (sv){
      if ((sv.startTs || 0) < since) return
      ;(sv.sets || []).forEach(function (x){
        if (x.isWarmup) return
        var mu = x.muscle || ((byId(x.exId) || {}).muscle) || '其他'
        m[mu] = (m[mu] || 0) + 1
      })
    })
    var total = Object.keys(m).reduce(function (s, k){ return s + m[k] }, 0) || 1
    return Object.keys(m).map(function (k){ return { muscle:k, pct:Math.round(m[k] / total * 100), sets:m[k] } })
      .sort(function (a, b){ return b.sets - a.sets })
  }
  /* 连续记录天数：每天至少 1 组训练 或 记餐 ≥2 餐；补记可计入 */
  function dayActive(date){
    if (Store.sessionsByDate(date).some(function (sv){ return setCount(sv) > 0 })) return true
    return Store.logs(date).length >= 2
  }
  function streak(){
    var n = 0, d = new Date()
    for (var i = 0; i < 400; i++){
      var key = d.toISOString().slice(0, 10)
      if (dayActive(key)) n++
      else if (i > 0) break
      else if (i === 0) { /* 今天还没记不算断，继续看昨天 */ }
      d.setDate(d.getDate() - 1)
    }
    return n
  }

  return { all:all, byId:byId, byName:byName, muscles:muscles, search:search, altsOf:altsOf,
           addUserEx:addUserEx, delUserEx:delUserEx,
           volumeOf:volumeOf, setCount:setCount, warmupCount:warmupCount, bodyweightSets:bodyweightSets,
           durationMin:durationMin, est1RM:est1RM, prOf:prOf, lastOf:lastOf, prsIn:prsIn,
           weeklyVolume:weeklyVolume, muscleSplit:muscleSplit, streak:streak }
})()
